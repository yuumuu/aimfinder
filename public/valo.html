<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sens Finder 3D — AI Sensitivity Optimizer</title>
<meta name="theme-color" content="#0f1923">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230f1923'/><path d='M7 9 L25 9 L23 23 L9 23 Z' fill='none' stroke='%23ff4655' stroke-width='2.5'/><circle cx='16' cy='16' r='2.5' fill='%23ece8e1'/></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0f1923; }

  :root {
    --v-bg: #0f1923;
    --v-bg-2: #0a141d;
    --v-bg-3: #060d13;
    --v-panel: #1a242f;
    --v-panel-2: #202d38;
    --v-panel-3: #2a3844;
    --v-line: #2f3c47;
    --v-line-2: #3a4a56;
    --v-red: #ff4655;
    --v-red-2: #bd3944;
    --v-red-3: #7a222a;
    --v-teal: #00ffba;
    --v-teal-2: #10b28a;
    --v-gold: #ffb800;
    --v-text: #ece8e1;
    --v-text-2: #c8cfca;
    --v-muted: #768079;
    --v-muted-2: #4f5a62;
    --v-muted-3: #2f3c47;
    --mono: 'JetBrains Mono', 'Consolas', 'SFMono-Regular', 'Courier New', monospace;
    --sans: 'Tungsten', 'Oswald', 'Impact', 'Arial Narrow', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
  }

  /* ============ LOADER ============ */
  #sf-loader { position: fixed; inset: 0; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #0f1923; color: var(--v-text); font-family: var(--mono); transition: opacity .4s; }
  #sf-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #sf-loader .spin-wrap { width: 44px; height: 44px; position: relative; }
  #sf-loader .spin-wrap::before, #sf-loader .spin-wrap::after { content: ''; position: absolute; inset: 0; border: 2px solid transparent; }
  #sf-loader .spin-wrap::before { border-top-color: var(--v-red); border-radius: 50%; animation: spin .9s linear infinite; }
  #sf-loader .spin-wrap::after { border-bottom-color: var(--v-teal); border-radius: 50%; animation: spin 1.4s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #sf-loader .brand { font-family: var(--sans); font-weight: 700; letter-spacing: 4px; font-size: 18px; color: var(--v-red); text-transform: uppercase; }
  #sf-loader .status { font-size: 11px; color: var(--v-muted); letter-spacing: 2px; text-transform: uppercase; }

  /* ============ ROOT ============ */
  #sf-root { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: var(--v-bg); color: var(--v-text); font-family: var(--body); display: flex; flex-direction: column; overflow: hidden; }
  #sf-root * { box-sizing: border-box; }

  /* ============ HEADER (Valorant style) ============ */
  .v-header {
    flex-shrink: 0;
    display: flex; align-items: stretch; height: 56px;
    background: var(--v-bg-3);
    border-bottom: 1px solid rgba(255,255,255,0.04);
    z-index: 20; position: relative;
  }
  .v-brand {
    display: flex; align-items: center; gap: 12px;
    padding: 0 24px;
    background: linear-gradient(135deg, var(--v-red) 0%, var(--v-red-2) 100%);
    position: relative;
    clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
    padding-right: 40px;
    z-index: 2;
  }
  .v-brand-mark {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    color: var(--v-text);
  }
  .v-brand-title {
    font-family: var(--sans);
    font-weight: 700; font-size: 17px;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--v-text); line-height: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .v-header-spacer { flex: 1; }
  .v-header-actions { display: flex; align-items: center; gap: 4px; padding: 0 20px; }
  .v-icon-btn {
    width: 36px; height: 36px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--v-text-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  }
  .v-icon-btn:hover { background: rgba(255,70,85,0.12); border-color: var(--v-red); color: var(--v-red); }
  .v-icon-btn:active { transform: scale(.94); }

  /* ============ BODY ============ */
  .v-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 28px 32px 32px; display: flex; flex-direction: column; }
  .v-body.no-scroll { overflow: hidden; padding: 0; }
  .v-body::-webkit-scrollbar { width: 8px; }
  .v-body::-webkit-scrollbar-track { background: transparent; }
  .v-body::-webkit-scrollbar-thumb { background: var(--v-line); }
  .v-body::-webkit-scrollbar-thumb:hover { background: var(--v-line-2); }
  .v-container { max-width: 1280px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  /* ============ TYPOGRAPHY ============ */
  .v-hero { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; position: relative; padding-left: 20px; }
  .v-hero::before {
    content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 4px;
    background: var(--v-red);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), 0 100%);
  }
  .v-title {
    font-family: var(--sans);
    font-size: 32px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    line-height: 1; color: var(--v-text);
  }
  .v-sub {
    color: var(--v-text-2); font-size: 13px;
    line-height: 1.6; max-width: 760px;
  }
  .v-sub strong { color: var(--v-text); font-weight: 700; }
  .v-sub em { color: var(--v-teal); font-style: normal; }

  .v-label {
    font-family: var(--sans);
    font-size: 11px; text-transform: uppercase;
    letter-spacing: 2px; color: var(--v-muted);
    font-weight: 700;
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px;
  }
  .v-label .v-icon { color: var(--v-red); }

  .v-kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 6px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    background: rgba(255,255,255,0.06);
    color: var(--v-text);
    border: 1px solid rgba(255,255,255,0.15);
    border-bottom-width: 2px;
    border-radius: 3px;
  }

  /* ============ PANELS (Valorant angular style) ============ */
  .v-panel {
    background: var(--v-panel);
    position: relative;
    display: flex; flex-direction: column;
    padding: 20px;
    gap: 14px;
    border-left: 3px solid var(--v-red);
  }
  .v-panel::before {
    content: ''; position: absolute; inset: 0;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(255,70,85,0.03) 0%, transparent 40%);
  }
  .v-panel.neutral { border-left-color: var(--v-teal); }
  .v-panel.neutral::before { background: linear-gradient(135deg, rgba(0,255,186,0.03) 0%, transparent 40%); }
  .v-panel.hollow { border-left-color: var(--v-line-2); background: var(--v-bg-2); }
  .v-panel.hollow::before { background: none; }

  .v-panel-header {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .v-panel-header .v-icon { color: var(--v-red); }
  .v-panel-title {
    font-family: var(--sans);
    font-size: 13px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--v-text);
  }
  .v-panel-sub { font-family: var(--mono); font-size: 10.5px; color: var(--v-muted); margin-left: auto; letter-spacing: 1px; text-transform: uppercase; }

  .v-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .v-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .v-field { display: flex; flex-direction: column; }

  /* ============ INPUTS ============ */
  .v-input, .v-textarea {
    background: var(--v-bg-2);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--v-text);
    padding: 11px 14px;
    font-family: var(--mono);
    font-size: 14px;
    outline: none;
    transition: all .15s;
    width: 100%;
    letter-spacing: .5px;
  }
  .v-input:focus, .v-textarea:focus {
    border-color: var(--v-red);
    background: rgba(255,70,85,0.04);
    box-shadow: 0 0 0 2px rgba(255,70,85,0.15);
  }
  .v-textarea { resize: vertical; min-height: 56px; font-size: 11.5px; line-height: 1.5; }

  /* ============ BUTTONS ============ */
  .v-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--v-red);
    color: var(--v-text);
    border: none;
    padding: 12px 24px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .12s;
    clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    position: relative;
    white-space: nowrap;
  }
  .v-btn:hover:not(:disabled) { background: #ff5d6b; }
  .v-btn:active:not(:disabled) { transform: translateY(1px); }
  .v-btn:disabled { opacity: .4; cursor: not-allowed; }
  .v-btn.secondary { background: rgba(255,255,255,0.06); color: var(--v-text); border: 1px solid rgba(255,255,255,0.12); }
  .v-btn.secondary:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
  .v-btn.teal { background: var(--v-teal); color: var(--v-bg); }
  .v-btn.teal:hover:not(:disabled) { background: #1fffc6; }
  .v-btn.ghost { background: transparent; color: var(--v-text-2); border: 1px solid rgba(255,255,255,0.1); }
  .v-btn.ghost:hover:not(:disabled) { background: rgba(255,255,255,0.05); color: var(--v-text); }
  .v-btn.danger { background: transparent; color: var(--v-red); border: 1px solid rgba(255,70,85,0.4); }
  .v-btn.danger:hover:not(:disabled) { background: rgba(255,70,85,0.1); }
  .v-btn.sm { padding: 8px 16px; font-size: 12px; letter-spacing: 1.5px; }
  .v-btn.lg { padding: 16px 40px; font-size: 17px; letter-spacing: 3px; clip-path: polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%); }
  .v-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .v-error { color: var(--v-red); font-size: 12px; font-family: var(--mono); min-height: 16px; }

  /* ============ RADIO / OPTIONS ============ */
  .v-opt-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .v-opt {
    flex: 1; min-width: 90px;
    background: var(--v-bg-2);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 10px 12px;
    cursor: pointer;
    transition: all .15s;
    text-align: center;
    position: relative;
    user-select: none;
  }
  .v-opt:hover { border-color: rgba(255,255,255,0.2); background: var(--v-panel-2); }
  .v-opt.selected {
    background: rgba(255,70,85,0.08);
    border-color: var(--v-red);
  }
  .v-opt.selected::after {
    content: ''; position: absolute; top: 4px; right: 4px;
    width: 6px; height: 6px; background: var(--v-red);
    box-shadow: 0 0 8px var(--v-red);
  }
  .v-opt-title { font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
  .v-opt-desc { font-family: var(--mono); font-size: 10px; color: var(--v-muted); letter-spacing: .5px; margin-top: 2px; }

  /* ============ TABS ============ */
  .v-tabs { display: flex; gap: 2px; background: var(--v-bg-2); padding: 3px; }
  .v-tab {
    flex: 1;
    padding: 9px 12px;
    background: transparent;
    border: none;
    color: var(--v-muted);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  .v-tab:hover { color: var(--v-text-2); background: rgba(255,255,255,0.03); }
  .v-tab.active { background: var(--v-panel-2); color: var(--v-red); }

  /* ============ CROSSHAIR PREVIEW ============ */
  .v-crosshair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .v-crosshair-preview {
    background: radial-gradient(ellipse at center, #1a2632 0%, #0a141d 100%);
    border: 1px solid var(--v-line);
    min-height: 170px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .v-crosshair-preview::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 22px 22px; pointer-events: none;
  }
  .v-crosshair-preview::after {
    content: ''; position: absolute; top: 8px; left: 8px;
    width: 12px; height: 12px;
    border-top: 2px solid var(--v-red);
    border-left: 2px solid var(--v-red);
  }
  .v-crosshair-preview > svg { position: relative; z-index: 1; }

  /* ============ SLIDERS ============ */
  .v-slider-row { display: flex; align-items: center; gap: 10px; }
  .v-slider-label {
    font-family: var(--mono); font-size: 10.5px;
    color: var(--v-muted); width: 90px; flex-shrink: 0;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .v-slider {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; background: var(--v-panel-3);
    outline: none; cursor: pointer;
  }
  .v-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 16px;
    background: var(--v-red);
    cursor: pointer; border: none;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  .v-slider::-moz-range-thumb {
    width: 12px; height: 16px;
    background: var(--v-red); cursor: pointer;
    border: none;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  .v-slider-val { font-family: var(--mono); font-size: 11px; color: var(--v-text-2); width: 42px; text-align: right; flex-shrink: 0; }

  /* ============ TOGGLES ============ */
  .v-toggles { display: flex; gap: 8px; flex-wrap: wrap; }
  .v-toggle {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    background: var(--v-bg-2);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--v-muted); font-size: 11.5px;
    font-family: var(--sans); font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase;
    cursor: pointer; transition: all .15s; user-select: none;
  }
  .v-toggle:hover { border-color: rgba(255,255,255,0.2); color: var(--v-text-2); }
  .v-toggle.active { background: rgba(0,255,186,0.08); border-color: var(--v-teal); color: var(--v-teal); }
  .v-toggle-dot { width: 6px; height: 6px; background: var(--v-muted-2); transition: all .15s; }
  .v-toggle.active .v-toggle-dot { background: var(--v-teal); box-shadow: 0 0 8px var(--v-teal); }

  /* ============ COLORS ============ */
  .v-color-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .v-color {
    width: 24px; height: 24px; cursor: pointer;
    border: 2px solid transparent; transition: all .15s;
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  .v-color:hover { transform: scale(1.1); }
  .v-color.active { border-color: var(--v-text); box-shadow: 0 0 0 2px var(--v-bg), 0 0 0 3px var(--v-text); }

  /* ============ INFO ============ */
  .v-info {
    background: rgba(0,255,186,0.05);
    border-left: 3px solid var(--v-teal);
    padding: 11px 14px;
    font-size: 12px; line-height: 1.55;
    color: var(--v-text-2);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .v-info .v-icon { color: var(--v-teal); flex-shrink: 0; margin-top: 1px; }
  .v-warn {
    background: rgba(255,184,0,0.06);
    border-left: 3px solid var(--v-gold);
    padding: 11px 14px;
    font-size: 12px; line-height: 1.55;
    color: var(--v-text-2);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .v-warn .v-icon { color: var(--v-gold); flex-shrink: 0; margin-top: 1px; }

  /* ============ SHORTCUTS ============ */
  .v-shortcuts { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .v-shortcut { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--v-text-2); font-family: var(--mono); }

  /* ============ DETAILS ============ */
  .v-details { background: var(--v-bg-2); border-left: 3px solid var(--v-line-2); }
  .v-details > summary {
    cursor: pointer; padding: 12px 16px;
    font-family: var(--sans); font-size: 12.5px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--v-text-2);
    display: flex; align-items: center; gap: 8px;
    list-style: none; user-select: none;
  }
  .v-details > summary::-webkit-details-marker { display: none; }
  .v-details > summary::before { content: '▸'; color: var(--v-red); transition: transform .2s; display: inline-block; }
  .v-details[open] > summary::before { transform: rotate(90deg); }
  .v-details > summary:hover { color: var(--v-text); }
  .v-details-body { padding: 16px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 14px; }

  /* ============ VAULT ============ */
  .v-vault-list { display: flex; flex-direction: column; gap: 6px; }
  .v-vault-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--v-bg-2);
    border: 1px solid rgba(255,255,255,0.06);
    transition: all .15s;
  }
  .v-vault-item:hover { border-color: rgba(255,255,255,0.15); background: var(--v-panel-2); }
  .v-vault-item-info { flex: 1; min-width: 0; }
  .v-vault-item-title { font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .v-vault-item-meta { font-family: var(--mono); font-size: 10.5px; color: var(--v-muted); margin-top: 2px; }
  .v-vault-empty { padding: 16px; text-align: center; font-family: var(--mono); font-size: 11.5px; color: var(--v-muted); }

  /* ============ HISTORY CHART ============ */
  .v-history { background: var(--v-bg-2); border: 1px solid var(--v-line); padding: 12px; overflow: hidden; }
  .v-history svg { display: block; width: 100%; height: auto; }

  /* ============ HEATMAP ============ */
  .v-heatmap-wrap { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }
  .v-heatmap-svg { background: radial-gradient(ellipse at center, #1a2632 0%, #0a141d 100%); border: 1px solid var(--v-line); }
  .v-heatmap-legend { display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--v-text-2); }
  .v-legend-row { display: flex; align-items: center; gap: 8px; }
  .v-legend-dot { width: 10px; height: 10px; }

  /* ============ MODAL ============ */
  .v-modal-bg { position: fixed; inset: 0; z-index: 100; background: rgba(6,13,19,0.9); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .v-modal { background: var(--v-panel); border-left: 3px solid var(--v-red); max-width: 520px; width: 100%; padding: 24px; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto; }
  .v-modal-title { font-family: var(--sans); font-size: 20px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
  .v-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* ============ TEST SCREEN ============ */
  #scene-wrap { position: absolute; inset: 0; overflow: hidden; background: #05070a; display: flex; align-items: center; justify-content: center; z-index: 0; }
  #scene-wrap canvas { display: block; width: 100% !important; height: 100% !important; }
  #crosshair-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; display: flex; align-items: center; justify-content: center; }
  #crosshair-container.miss > svg rect, #crosshair-container.miss > svg circle { fill: var(--v-red) !important; }

  .v-hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 24px; z-index: 5; pointer-events: none; font-family: var(--mono); color: var(--v-muted); text-shadow: 0 2px 6px rgba(0,0,0,0.9); }

  }

  #test-overlay { position: absolute; inset: 0; z-index: 15; background: rgba(6,13,19,0.92); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 40px 32px; overflow-y: auto; }

  .v-table tr.best td { background: rgba(0,255,186,0.06); }

  .v-bar-row { display: flex; align-items: center; gap: 10px; }

  .v-bar-track { flex: 1; height: 12px; background: var(--v-bg-2); overflow: hidden; border: 1px solid rgba(255,255,255,0.04); }

  .v-bar-fill.teal { background: linear-gradient(90deg, var(--v-teal-2), var(--v-teal)); }
  .v-bar-val { font-family: var(--mono); font-size: 11px; width: 40px; text-align: right; flex-shrink: 0; color: var(--v-text-2); }

  .v-disclaimer { font-size: 11px; color: var(--v-muted); border-top: 1px solid rgba(255,255,255,0.05); padding-top: 14px; line-height: 1.6; }

  @media (max-width: 900px) {

    .v-timer-big { font-size: 42px; top: 50px; }
    .v-countdown-big { font-size: 110px; }
    #realtime-graph { width: 160px; height: 56px; }
  }

      k = kKernel1D(edpi - obs[i].edpi, sigma);
      num += k * obs[i].score;
      den += k;
    }
    if (den < 1e-9) return { mean: 0, variance: 2500, weight: 0 };
    var mean = num / den, v = 0;
    for (i = 0; i < n; i++) {

      return '<div class="v-vault-item">' +

  function renderHistoryCard() {
    var recent = sessionHistory.slice(-10);
    var maxE = 1, minE = Infinity;
    recent.forEach(function(h) { if (h.edpi > maxE) maxE = h.edpi; if (h.edpi < minE) minE = h.edpi; });
    if (minE === Infinity) minE = 0;
    var range = Math.max(1, maxE - minE);
    var W = 800, H = 120, PAD = 34;
    var stepX = recent.length > 1 ? (W - PAD*2) / (recent.length - 1) : 0;
    var pts = recent.map(function(h, i) {
      var x = PAD + i * stepX;
      var y = H - PAD - ((h.edpi - minE) / range) * (H - PAD*2);
      return x + ',' + y;
    });
    var pathStr = 'M' + pts.join(' L');
    var dots = recent.map(function(h, i) {
      var x = PAD + i * stepX;
      var y = H - PAD - ((h.edpi - minE) / range) * (H - PAD*2);
      return '<circle cx="' + x + '" cy="' + y + '" r="4" fill="#00ffba" stroke="#0f1923" stroke-width="2"/>';
    }).join('');
    return '<div class="v-panel hollow">' +
      '<div class="v-panel-header">' + icon('chart', 16) + '<div class="v-panel-title">Session History</div>' +
        '<div class="v-panel-sub">' + sessionHistory.length + ' sessions</div></div>' +
      '<div class="v-sub" style="font-size:11.5px;">eDPI optimal per sesi. Range ' + Math.round(minE) + ' – ' + Math.round(maxE) + '.</div>' +
      '<div class="v-history">' +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
          '<path d="' + pathStr + '" fill="none" stroke="#ff4655" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
          dots +
        '</svg>' +
      '</div>' +
      '<div class="v-btn-row" style="justify-content:flex-end;">' +
        '<button class="v-btn ghost sm" id="btn-clear-history">' + icon('trash', 13) + 'Clear History</button>' +
      '</div>' +
    '</div>';
  }

  function bindSetupEvents() {
    Array.prototype.forEach.call(document.querySelectorAll('#game-group .v-opt'), function(el){
      el.addEventListener('click', function(){
        if (el.dataset.key === state.game) return;
        switchGame(el.dataset.key);
        renderSetup();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#task-group .v-opt'), function(el){
      el.addEventListener('click', function(){
        state.taskMix = el.dataset.key;
        Array.prototype.forEach.call(document.querySelectorAll('#task-group .v-opt'), function(r){ r.classList.remove('selected'); });
        el.classList.add('selected');
        saveCurrentToProfile();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#dist-group .v-opt'), function(el){
      el.addEventListener('click', function(){
        state.distanceMode = el.dataset.key;
        Array.prototype.forEach.call(document.querySelectorAll('#dist-group .v-opt'), function(r){ r.classList.remove('selected'); });
        el.classList.add('selected');
        saveCurrentToProfile();
      });
    });

    var soundToggle = document.getElementById('sound-toggle');
    if (soundToggle) soundToggle.addEventListener('click', function(){
      state.soundEnabled = !state.soundEnabled;
      soundToggle.classList.toggle('active', state.soundEnabled);
      AudioSys.setEnabled(state.soundEnabled);
      if (state.soundEnabled) { AudioSys.unlock(); AudioSys.tick(); }
      saveCurrentToProfile();
    });
    var warmToggle = document.getElementById('warmup-toggle');
    if (warmToggle) warmToggle.addEventListener('click', function(){
      state.warmupEnabled = !state.warmupEnabled;
      warmToggle.classList.toggle('active', state.warmupEnabled);
      saveCurrentToProfile();
    });
    var graphToggle = document.getElementById('graph-toggle');
    if (graphToggle) graphToggle.addEventListener('click', function(){
      state.graphEnabled = !state.graphEnabled;
      graphToggle.classList.toggle('active', state.graphEnabled);
      saveCurrentToProfile();
    });

    var fovSlider = document.getElementById('fov-slider');
    var fovVal = document.getElementById('fov-val');
    if (fovSlider) fovSlider.addEventListener('input', function(){
      state.hFov = parseFloat(fovSlider.value);
      if (fovVal) fovVal.textContent = state.hFov + '°';
      saveCurrentToProfile();
    });
    Array.prototype.forEach.call(document.querySelectorAll('#fov-presets [data-fov]'), function(btn){
      btn.addEventListener('click', function(){
        state.hFov = parseInt(btn.dataset.fov, 10);
        if (fovSlider) fovSlider.value = state.hFov;
        if (fovVal) fovVal.textContent = state.hFov + '°';
        saveCurrentToProfile();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('#ch-tabs .v-tab'), function(tab){
      tab.addEventListener('click', function(){
        state.crosshairTab = tab.dataset.tab;
        Array.prototype.forEach.call(document.querySelectorAll('#ch-tabs .v-tab'), function(t){
          t.classList.toggle('active', t.dataset.tab === state.crosshairTab);
        });
        document.getElementById('ch-input-valorant').style.display = state.crosshairTab === 'valorant' ? '' : 'none';
        document.getElementById('ch-input-cs2').style.display      = state.crosshairTab === 'cs2' ? '' : 'none';
        document.getElementById('ch-input-custom').style.display   = state.crosshairTab === 'custom' ? '' : 'none';
      });
    });
    var vBtn = document.getElementById('ch-valorant-apply');
    if (vBtn) vBtn.addEventListener('click', function(){
      var parsed = parseValorantCode(document.getElementById('ch-valorant-code').value);
      if (parsed) { state.crosshair = parsed; saveCurrentToProfile(); updateCrosshairPreview(); }
    });
    var cBtn = document.getElementById('ch-cs2-apply');
    if (cBtn) cBtn.addEventListener('click', function(){
      var parsed = parseCS2Code(document.getElementById('ch-cs2-code').value);
      if (parsed) { state.crosshair = parsed; saveCurrentToProfile(); updateCrosshairPreview(); }
    });
    Array.prototype.forEach.call(document.querySelectorAll('#ch-colors .v-color'), function(sw){
      sw.addEventListener('click', function(){
        state.crosshair.color = sw.dataset.color;
        Array.prototype.forEach.call(document.querySelectorAll('#ch-colors .v-color'), function(s){
          s.classList.toggle('active', s.dataset.color === state.crosshair.color);
        });
        saveCurrentToProfile(); updateCrosshairPreview();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#ch-input-custom .v-slider'), function(sl){
      sl.addEventListener('input', function(){
        var prop = sl.dataset.prop;
        state.crosshair[prop] = parseFloat(sl.value);
        var valEl = document.querySelector('[data-val="' + prop + '"]');
        if (valEl) valEl.textContent = sl.value;
        saveCurrentToProfile(); updateCrosshairPreview();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#ch-input-custom .v-toggle'), function(tg){
      tg.addEventListener('click', function(){
        var prop = tg.dataset.toggle;
        state.crosshair[prop] = !state.crosshair[prop];
        tg.classList.toggle('active', state.crosshair[prop]);
        saveCurrentToProfile(); updateCrosshairPreview();
      });
    });
    var copyCs2 = document.getElementById('ch-copy-cs2');
    if (copyCs2) copyCs2.addEventListener('click', function(){
      var txt = generateCS2Commands(state.crosshair);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function(){
          var orig = copyCs2.innerHTML;
          copyCs2.innerHTML = icon('check', 13) + 'Copied';
          setTimeout(function(){ copyCs2.innerHTML = orig; }, 1400);
        }).catch(function(){});
      }
    });

    /* Vault */
    var vaultSave = document.getElementById('vault-save');
    if (vaultSave) vaultSave.addEventListener('click', function(){
      var label = prompt('Label untuk preset ini:', 'Preset ' + (vault.length + 1));
      if (!label) return;
      vault.push({
        label: label.slice(0, 30),
        game: state.game,
        sens: state.baseSens,
        dpi: state.dpi,
        crosshair: Object.assign({}, state.crosshair),
        hFov: state.hFov,
        ts: Date.now()
      });
      saveVault();
      var cont = document.getElementById('vault-list-container');
      if (cont) cont.innerHTML = renderVaultList();
      bindVaultEvents();
    });
    bindVaultEvents();

    function bindVaultEvents() {
      Array.prototype.forEach.call(document.querySelectorAll('[data-vault-load]'), function(btn){
        btn.addEventListener('click', function(){
          var idx = parseInt(btn.dataset.vaultLoad, 10);
          var v = vault[idx]; if (!v) return;
          state.game = v.game;
          profiles.activeGame = v.game;
          state.baseSens = v.sens;
          state.dpi = v.dpi;
          state.crosshair = Object.assign(defaultCrosshair(), v.crosshair || {});
          state.hFov = v.hFov || 103;
          saveCurrentToProfile();
          renderSetup();
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-vault-del]'), function(btn){
        btn.addEventListener('click', function(){
          var idx = parseInt(btn.dataset.vaultDel, 10);
          if (confirm('Hapus preset ini?')) {
            vault.splice(idx, 1);
            saveVault();
            var cont = document.getElementById('vault-list-container');
            if (cont) cont.innerHTML = renderVaultList();
            bindVaultEvents();
          }
        });
      });
    }

    var dpiCalOpen = document.getElementById('dpi-cal-open');
    if (dpiCalOpen) dpiCalOpen.addEventListener('click', openDPICalibrator);
    var btnExport = document.getElementById('btn-export');
    if (btnExport) btnExport.addEventListener('click', exportAllJSON);
    var btnImport = document.getElementById('btn-import');
    if (btnImport) btnImport.addEventListener('click', importAllJSON);
    var btnClearAll = document.getElementById('btn-clear-all');
    if (btnClearAll) btnClearAll.addEventListener('click', function(){
      if (confirm('Hapus SEMUA settings, history, dan profiles?')) {
        ['profiles', 'history', 'vault', 'settings', 'crosshair'].forEach(STORAGE.remove);
        location.reload();
      }
    });
    var btnClearHist = document.getElementById('btn-clear-history');
    if (btnClearHist) btnClearHist.addEventListener('click', function(){
      sessionHistory = [];
      STORAGE.save('history', []);
      renderSetup();
    });

    var startBtn = document.getElementById('sf-start-btn');
    if (startBtn) startBtn.addEventListener('click', function(){
      var dpiVal  = parseFloat(document.getElementById('sf-dpi').value);
      var sensVal = parseFloat(document.getElementById('sf-sens').value);
      var err = document.getElementById('sf-error');
      if (!dpiVal || dpiVal <= 0 || dpiVal > 100000) { err.textContent = 'DPI tidak valid.'; return; }
      if (!sensVal || sensVal <= 0 || sensVal > 100)  { err.textContent = 'Sens tidak valid.'; return; }
      err.textContent = '';
      state.dpi = dpiVal;
      state.baseSens = sensVal;
      state.baseDpi = dpiVal;
      state.baseEdpi = sensVal * dpiVal;
      AudioSys.unlock();
      saveCurrentToProfile();

      /* eDPI range: 0.4x .. 2.5x of user's base eDPI */
      state.edpiMin = Math.max(50, state.baseEdpi * 0.4);
      state.edpiMax = Math.min(5000, state.baseEdpi * 2.5);

      state.trials = []; state.observations = []; state.optimum = null;
      state.missData = [];
      state.consecutiveBad = 0;
      state.streak = 0;
      startOptimizer();
    });
  }

  function exportAllJSON() {
    var data = { version: 3, ts: Date.now(), profiles: profiles, history: sessionHistory, vault: vault };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'sens-finder-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function importAllJSON() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = function() {
      var f = inp.files && inp.files[0]; if (!f) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var data = JSON.parse(e.target.result);
          if (data && data.profiles && data.profiles.games) {
            profiles = data.profiles;
            saveProfiles();
            sessionHistory = Array.isArray(data.history) ? data.history : [];
            STORAGE.save('history', sessionHistory);
            vault = Array.isArray(data.vault) ? data.vault : [];
            saveVault();
            applyProfileToState();
            renderSetup();
          } else alert('Format tidak dikenal.');
        } catch (err) { alert('Gagal: ' + err.message); }
      };
      reader.readAsText(f);
    };
    inp.click();
  }

  function initRealtimeGraph() {
    var c = document.getElementById('realtime-graph'); if (!c) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = c.clientWidth || 220, h = c.clientHeight || 70;
    c.width = Math.floor(w * dpr); c.height = Math.floor(h * dpr);
    state.graphCanvas = c;
    state.graphCtx = c.getContext('2d');
    if (state.graphCtx) state.graphCtx.scale(dpr, dpr);
    state.graphIdx = 0;
    for (var i = 0; i < state.graphOmega.length; i++) { state.graphOmega[i] = 0; state.graphDist[i] = 0; }
  }
  function drawRealtimeGraph() {
    var c = state.graphCanvas, ctx = state.graphCtx; if (!c || !ctx) return;
    var w = c.clientWidth, h = c.clientHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();
    var N = state.graphOmega.length, maxOmega = 1, maxD = 1;
    for (var i = 0; i < N; i++) { if (state.graphOmega[i] > maxOmega) maxOmega = state.graphOmega[i]; if (state.graphDist[i] > maxD) maxD = state.graphDist[i]; }
    ctx.strokeStyle = '#00ffba'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var i = 0; i < N; i++) {
      var x = (i / (N - 1)) * w;
      var y = (h/2) - (state.graphOmega[i] / maxOmega) * (h/2 - 2);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.strokeStyle = '#ff4655'; ctx.beginPath();
    for (var i = 0; i < N; i++) {
      var x = (i / (N - 1)) * w;
      var y = h - (state.graphDist[i] / maxD) * (h/2 - 2);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '9px monospace';
    ctx.fillText('ω', 4, 12); ctx.fillText('dist', 4, h - 4);
  }

  /* ===== MAIN LOOP ===== */
  function taskSequence() {
    if (state.taskMix !== 'mixed') return state.taskMix;
    var seq = ['flick', 'micro', 'tracking'];
    return seq[Math.floor(Math.random() * seq.length)];
  }
  function showStreak(n) {

    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
    AudioSys.streak(n);

  async function runOptimizer() {
    if (state.warmupEnabled) {
      var wp = { sens: state.baseSens, edpi: state.baseSens * state.dpi, warmup: true, taskType: 'flick' };
      await showTrialIntro(0, wp);
      await sleep(80);
      if (!isPointerLocked()) {
        var wa = await showPauseMenu('Pointer lock gagal.');
        if (wa === 'exit' || wa === 'restart_session') { returnToSetup(); return; }
      } else {
        await showActiveCountdown();
        await runSingleTest(wp, 0);
        releasePointerLock();
      }
    }

    for (var i = 0; i < TOTAL_TRIALS; i++) {
      var pt = await pickPoint(i);
      pt.taskType = taskSequence();
      var outerContinue = false;
      while (!outerContinue) {
        await showTrialIntro(i + 1, pt);
        await sleep(80);
        if (!isPointerLocked()) {
          var action = await showPauseMenu('Pointer lock gagal aktif.');
          if (action === 'restart_trial') continue;
          if (action === 'restart_session') { returnToSetup(); return; }
          if (action === 'exit') { returnToSetup(); return; }
          continue;
        }
        await showActiveCountdown();
        if (!isPointerLocked()) {
          var action2 = await showPauseMenu('Pointer lock terlepas.');
          if (action2 === 'restart_trial') continue;
          if (action2 === 'restart_session') { returnToSetup(); return; }
          if (action2 === 'exit') { returnToSetup(); return; }
          continue;
        }
        var result = await runSingleTest(pt, i + 1);
        if (result === 'paused') {
          var action3 = await showPauseMenu(state.pauseReason);
          if (action3 === 'resume') continue;
          if (action3 === 'restart_trial') continue;
          if (action3 === 'restart_session') { returnToSetup(); return; }
          if (action3 === 'exit') { returnToSetup(); return; }
          continue;
        }
        registerTrial(result);
        releasePointerLock();
        AudioSys.complete();
        if (result.valid && result.score < 8) state.consecutiveBad++;
        else if (!result.valid) state.consecutiveBad++;
        else state.consecutiveBad = 0;
        await showTrialComplete(i + 1, result);
        if (state.consecutiveBad >= AFK_THRESH) {
          var afk = await showAFKDialog();
          if (afk === 'abort') { finishPSA(); return; }
          state.consecutiveBad = 0;
        }
        outerContinue = true;
      }
    }
    finishPSA();
  }

  function returnToSetup() {
    cleanupTest();
    if (state.renderer) {
      cancelAnimationFrame(state.animId);
      state.renderer.domElement.remove();
      state.renderer.dispose();
      state.renderer = null;
    }
    state.trials = []; state.observations = []; state.optimum = null;
    state.missData = [];
    state.screen = 'setup';
    render();
  }

  /* ===== PICK POINT — 1D on eDPI ===== */
  async function pickPoint(i) {
    var userDpi = state.dpi;
    if (i === 0) {
      return { sens: state.baseSens, dpi: userDpi, edpi: state.baseEdpi };
    }
    if (i <= EXPLORE_TRIALS) {
      var e;
      if (i % 2 === 1 || state.observations.length === 0) {
        e = rand(state.edpiMin, state.edpiMax);
      } else {
        var best = state.observations.reduce(function(a, b){ return b.score > a.score ? b : a; });
        var sd = (state.edpiMax - state.edpiMin) * 0.18;
        e = clamp(gauss(best.edpi, sd), state.edpiMin, state.edpiMax);
      }
      return { sens: e / userDpi, dpi: userDpi, edpi: e };
    }
    var suggestedEdpi = await requestSuggest();
    return { sens: suggestedEdpi / userDpi, dpi: userDpi, edpi: suggestedEdpi };
  }

  function registerTrial(t) {
    state.trials.push(t);
    if (t.valid) state.observations.push({ edpi: t.edpi, score: t.score });
  }

                '<div class="v-toggle ' + (state.crosshair.outline ? 'active' : '') + '" data-toggle="outline"><span class="v-toggle-dot"></span>Outline</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="v-actions" style="max-width:360px;">' +
            '<button class="v-btn secondary" data-action="back">' + icon('arrowLeft', 16) + 'Kembali</button>' +
          '</div>';
        Array.prototype.forEach.call(overlay.querySelectorAll('.v-color'), function(sw){
          sw.addEventListener('click', function(){
            state.crosshair.color = sw.dataset.color;
            saveCurrentToProfile(); renderCrosshair(); updateCrosshairPreview();
          });
        });
        Array.prototype.forEach.call(overlay.querySelectorAll('.v-slider'), function(sl){
          sl.addEventListener('input', function(){
            var prop = sl.dataset.prop;
            state.crosshair[prop] = parseFloat(sl.value);
            var valEl = overlay.querySelector('[data-val="' + prop + '"]');
            if (valEl) valEl.textContent = sl.value;
            saveCurrentToProfile(); updateCrosshairPreview();
          });
        });
        Array.prototype.forEach.call(overlay.querySelectorAll('.v-toggle'), function(tg){
          tg.addEventListener('click', function(){
            var prop = tg.dataset.toggle;
            state.crosshair[prop] = !state.crosshair[prop];
            saveCurrentToProfile(); renderCrosshair(); updateCrosshairPreview();
          });
        });
        var backBtn = overlay.querySelector('[data-action="back"]');
        if (backBtn) backBtn.addEventListener('click', function(){ renderMenu(); });
      }

      renderMenu();
    });
  }

  /* ===== TRIAL RUNNER ===== */
  function runSingleTest(pt, round) {
    return new Promise(function(resolve){
      if (!isPointerLocked()) { resolve('paused'); state.pauseReason = 'Pointer lock tidak aktif.'; return; }
      resetTelemetry();
      state.testActive = true;
      state.testHits = 0; state.testMisses = 0; state.testWeightedHits = 0;
      state.testRt = [];
      state.testStartTime = performance.now();
      state.targetSpawnTime = 0;
      state.targetReacted = false;
      state.testSens = pt.sens;
      state.yaw = 0; state.pitch = 0;
      state.hudTimer = null; state.testTimer = null;
      state.trialResolve = resolve;
      state.currentTaskType = pt.taskType || 'flick';
      state.isWarmup = !!pt.warmup;
      state.trackOnTarget = 0; state.trackTotal = 0;
      state.missData = [];
      state.streak = 0;
      if (state.camera) state.camera.quaternion.set(0, 0, 0, 1);

      var hudHits  = document.getElementById('hud-hits');
      var hudTime  = document.getElementById('hud-time');
      var hudSens  = document.getElementById('hud-sens');
      var hudRound = document.getElementById('hud-round');
      var hudTask  = document.getElementById('hud-task-label');
      var timerBar = document.getElementById('timer-bar');
      var timerBig = document.getElementById('timer-big');
      if (hudRound) hudRound.textContent = state.isWarmup ? 'W' : round;
      if (hudSens)  hudSens.textContent  = Math.round(pt.edpi);
      if (hudTask)  hudTask.textContent  = TASK_MODES[state.currentTaskType].label;

      spawnTarget();
      var dur = state.isWarmup ? WARMUP_DURATION : TEST_DURATION;

      state.hudTimer = setInterval(function(){
        if (!state.testActive) return;
        var elapsed = performance.now() - state.testStartTime;
        var remaining = Math.max(0, (dur - elapsed) / 1000);
        var pct = clamp(elapsed / dur, 0, 1) * 100;
        if (hudHits) hudHits.textContent = state.testHits;
        if (hudTime) hudTime.textContent = Math.ceil(remaining);
        if (timerBar) timerBar.style.width = pct + '%';
        if (timerBig) {
          timerBig.textContent = Math.ceil(remaining);
          timerBig.classList.toggle('warning', remaining < 4);
        }
      }, 80);

      state.testTimer = setTimeout(function(){
        if (!state.testActive) return;
        state.testActive = false;
        if (state.hudTimer) { clearInterval(state.hudTimer); state.hudTimer = null; }
        if (state.target) { state.scene.remove(state.target); state.target = null; }
        state.trialResolve = null;
        resolve(computeTrialResult(pt, round));
      }, dur);
    });
  }

  function pauseTest(reason) {
    if (!state.testActive) return;
    state.testActive = false;
    state.pauseReason = reason;
    if (state.hudTimer) { clearInterval(state.hudTimer); state.hudTimer = null; }
    if (state.testTimer) { clearTimeout(state.testTimer); state.testTimer = null; }
    if (state.target) { state.scene.remove(state.target); state.target = null; }
    releasePointerLock();
    if (state.trialResolve) { var r = state.trialResolve; state.trialResolve = null; r('paused'); }
  }

  /* ===== METRICS ===== */
  function computeTrialResult(pt, round) {
    var n = telemetry.n, i;
    var sum = 0, sum2 = 0, cnt = 0;
    for (i = 0; i < n; i++) {
      if (telemetry.w[i] < 0.2) continue;
      var a = telemetry.a[i]; if (!isFinite(a)) continue;
      sum += a; sum2 += a * a; cnt++;
    }
    var meanA = cnt ? sum / cnt : 0;
    var varA  = cnt > 1 ? Math.max(0, sum2 / cnt - meanA * meanA) : 0;
    var sdA   = Math.sqrt(varA);
    var smoothness = 1 / (1 + sdA / SMOOTH_REF);

    var dsum = 0, dcnt = 0, depthSum = 0;
    for (i = 0; i < n; i++) {
      if (telemetry.dist[i] <= 0) continue;
      dsum += telemetry.dev[i]; depthSum += telemetry.dist[i]; dcnt++;
    }
    var devRad = dcnt ? dsum / dcnt : DEV_REF;
    var deviation = clamp(devRad / DEV_REF, 0, 1);
    var meanDepth = dcnt ? depthSum / dcnt : 0;

    var accuracy;
    if (state.currentTaskType === 'tracking') {
      accuracy = state.trackTotal > 0 ? (state.trackOnTarget / state.trackTotal) : 0;
    } else {
      accuracy = (state.testWeightedHits + state.testMisses) > 0
        ? state.testWeightedHits / (state.testWeightedHits + state.testMisses) : 0;
    }

    var meanRt = 1500;
    if (state.testRt.length) {
      var rs = 0;
      for (i = 0; i < state.testRt.length; i++) rs += state.testRt[i];
      meanRt = rs / state.testRt.length;
    }
    var rtNorm = clamp(meanRt / RT_REF, 0, 1);
    var raw = 0.40 * accuracy + 0.30 * smoothness - 0.20 * deviation - 0.10 * rtNorm;
    var score = clamp((raw + 0.30) * 100, 0, 100);

    var t = {
      index: round,
      sens: pt.sens, dpi: pt.dpi, edpi: pt.edpi,
      taskType: state.currentTaskType,
      warmup: !!pt.warmup,
      accuracy: accuracy, smoothness: smoothness, deviation: deviation,
      rt: meanRt, rtNorm: rtNorm, score: score,
      hits: state.testHits, misses: state.testMisses,
      trackOnTarget: state.trackOnTarget, trackTotal: state.trackTotal,
      frames: n, maxGap: telemetry.maxGap, meanDepth: meanDepth,
      missData: state.missData.slice(), valid: false
    };
    t.valid = isValidTrial(t);
    return t;
  }

  function isValidTrial(t) {
    if (t.warmup) return false;
    if (t.frames < 60) return false;
    if (t.maxGap > 0.40) return false;
    if (t.taskType === 'tracking') {
      if (t.trackTotal < 200) return false;
      if (t.accuracy < 0.10) return false;
    } else {
      if (t.hits + t.misses < 4) return false;
      if (t.hits < 1) return false;
      if (t.accuracy < 0.10) return false;
      if (t.rt > 1500) return false;
    }
    if (t.smoothness < 0.02) return false;
    return true;
  }

  /* ===== WORKER ===== */
  function createWorker() {
    try {
      var src =
        'var kKernel1D=' + kKernel1D.toString() + ';\n' +
        'var kRegress1D=' + kRegress1D.toString() + ';\n' +
        'var kOptimize1D=' + kOptimize1D.toString() + ';\n' +
        'var kAcquire1D=' + kAcquire1D.toString() + ';\n' +
        'self.onmessage=function(e){var m=e.data,res;' +
          'if(m.cmd==="optimize"){res=kOptimize1D(m.obs,m.edpiMin,m.edpiMax,m.sigma);}' +
          'else if(m.cmd==="suggest"){res=kAcquire1D(m.obs,m.edpiMin,m.edpiMax,m.sigma,m.kappa);}' +
          'self.postMessage({id:m.id,result:res});};';
      var url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
      var w = new Worker(url);
      w.onmessage = function(e){
        var p = state.pending[e.data.id];
        if (p) { delete state.pending[e.data.id]; p.resolve(e.data.result); }
      };
      w.onerror = function(){
        state.worker = null;
        for (var id in state.pending) {
          var p = state.pending[id]; delete state.pending[id];
          try { p.resolve(p.local()); } catch (err) { p.resolve(null); }
        }
      };
      return w;
    } catch (err) { return null; }
  }
  function requestSuggest() {
    return new Promise(function(resolve){
      var local = function(){ return kAcquire1D(state.observations, state.edpiMin, state.edpiMax, SIGMA_E, UCB_KAPPA); };
      if (state.worker) {
        var id = ++state.reqId;
        state.pending[id] = { resolve: resolve, local: local };
        state.worker.postMessage({ cmd: 'suggest', id: id, obs: state.observations, edpiMin: state.edpiMin, edpiMax: state.edpiMax, sigma: SIGMA_E, kappa: UCB_KAPPA });
      } else resolve(local());
    });
  }
  function requestOptimize() {
    return new Promise(function(resolve){
      var local = function(){ return kOptimize1D(state.observations, state.edpiMin, state.edpiMax, SIGMA_E); };
      if (state.worker) {
        var id = ++state.reqId;
        state.pending[id] = { resolve: resolve, local: local };
        state.worker.postMessage({ cmd: 'optimize', id: id, obs: state.observations, edpiMin: state.edpiMin, edpiMax: state.edpiMax, sigma: SIGMA_E });
      } else resolve(local());
    });
  }

  /* ===== 3D SCENE ===== */
  var targetGeom = new THREE.SphereGeometry(0.55, 16, 16);
  var targetMat  = new THREE.MeshStandardMaterial({ color: 0xff4655, emissive: 0xff4655, emissiveIntensity: 0.5, metalness: 0.3, roughness: 0.4 });

  function computeVerticalFov(hFovDeg, aspect) {
    var hRad = hFovDeg * Math.PI / 180;
    var vRad = 2 * Math.atan(Math.tan(hRad / 2) / aspect);
    return vRad * 180 / Math.PI;
  }

  function spawnTarget() {
    if (!state.scene) return;
    if (state.target) state.scene.remove(state.target);
    state.target = new THREE.Mesh(targetGeom, targetMat);
    var taskType = state.currentTaskType;

    if (taskType === 'micro') {
      var lastX = state.lastTargetX || 0, lastY = state.lastTargetY || 2.5;
      var z = -12;
      var nx = clamp(lastX + (Math.random() - 0.5) * 4, -7, 7);
      var ny = clamp(lastY + (Math.random() - 0.5) * 4, 0.5, 5.5);
      state.target.position.set(nx, ny, z);
      state.lastTargetX = nx; state.lastTargetY = ny;
    } else if (taskType === 'tracking') {
      var mode = DISTANCE_MODES[state.distanceMode] || DISTANCE_MODES.mixed;
      var d = mode.minDist + Math.random() * (mode.maxDist - mode.minDist);
      state.trackBaseX = (Math.random() - 0.5) * 4;
      state.trackBaseY = 2 + Math.random() * 2;
      state.trackAmpX = 4 + Math.random() * 3;
      state.trackAmpY = 1.5 + Math.random() * 1.5;
      state.trackFx = 0.4 + Math.random() * 0.3;
      state.trackFy = 0.35 + Math.random() * 0.3;
      state.trackPhase = Math.random() * Math.PI * 2;
      state.target.position.set(state.trackBaseX, state.trackBaseY, -d);
      state.lastTargetX = state.trackBaseX; state.lastTargetY = state.trackBaseY;
    } else {
      var mode2 = DISTANCE_MODES[state.distanceMode] || DISTANCE_MODES.mixed;
      var d2 = mode2.minDist + Math.random() * (mode2.maxDist - mode2.minDist);
      var x = (Math.random() - 0.5) * 14;
      var y = 0.5 + Math.random() * 5;
      state.target.position.set(x, y, -d2);
      state.lastTargetX = x; state.lastTargetY = y;
    }
    state.scene.add(state.target);
    state.targetSpawnTime = performance.now();
    state.targetReacted = false;
  }

  function initScene() {
    if (state.renderer) { state.renderer.domElement.remove(); state.renderer.dispose(); }
    var wrap = document.getElementById('scene-wrap');
    if (!wrap) return;
    var w = wrap.clientWidth || window.innerWidth;
    var h = wrap.clientHeight || window.innerHeight;
    state.scene = new THREE.Scene();
    state.scene.background = new THREE.Color(0x0a0f14);
    state.scene.fog = new THREE.Fog(0x0a0f14, 25, 45);
    var aspect = w / h;
    var vFov = computeVerticalFov(state.hFov, aspect);
    state.camera = new THREE.PerspectiveCamera(vFov, aspect, 0.1, 100);
    state.camera.position.set(0, 1.7, 0);
    state.camera.quaternion.set(0, 0, 0, 1);
    state.renderer = new THREE.WebGLRenderer({ antialias: true });
    state.renderer.setSize(w, h);
    state.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    state.scene.add(new THREE.AmbientLight(0x354050, 0.65));
    var dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(5, 10, 7);
    state.scene.add(dirLight);
    var fillLight = new THREE.DirectionalLight(0x3a4a66, 0.4);
    fillLight.position.set(-5, 5, -5);
    state.scene.add(fillLight);
    var grid = new THREE.GridHelper(60, 30, 0x2a3844, 0x1a242f);
    grid.position.y = -0.5;
    state.scene.add(grid);
    state.raycaster = new THREE.Raycaster();
    animate();
  }

  function resizeScene() {
    if (!state.renderer) return;
    var wrap = document.getElementById('scene-wrap'); if (!wrap) return;
    var w = wrap.clientWidth, h = wrap.clientHeight;
    if (w > 0 && h > 0) {
      state.renderer.setSize(w, h);
      if (state.camera) {
        state.camera.aspect = w / h;
        state.camera.fov = computeVerticalFov(state.hFov, w / h);
        state.camera.updateProjectionMatrix();
      }
    }
  }

  function logFrame(now) {
    var n = telemetry.n; if (n >= TELEM_CAP) return;
    var q = state.camera.quaternion;
    var omega = 0, alpha = 0;
    if (_prevLogged) {
      var dt = (now - _prevTime) / 1000;
      if (dt > telemetry.maxGap) telemetry.maxGap = dt;
      if (dt > 0.0005) {
        _prevQInv.copy(_prevQ).invert();
        _dq.copy(q).multiply(_prevQInv);
        var angle = 2 * Math.acos(clamp(Math.abs(_dq.w), 0, 1));
        var omegaRaw = angle / dt;
        _omegaEMA += 0.4 * (omegaRaw - _omegaEMA);
        var alphaRaw = (_omegaEMA - _prevOmegaEMA) / dt;
        _alphaEMA += 0.4 * (alphaRaw - _alphaEMA);
        _prevOmegaEMA = _omegaEMA;
        omega = _omegaEMA; alpha = _alphaEMA;
      }
    }
    if (state.target && !state.targetReacted && omega > RT_MOVE_THRESH) {
      state.targetReacted = true;
      state.testRt.push(now - state.targetSpawnTime);
    }
    var dist = 0, dev = 0, onTarget = false;
    if (state.target) {
      _fwd.set(0, 0, -1).applyQuaternion(q);
      _toT.copy(state.target.position).sub(state.camera.position);
      dist = _toT.length();
      if (dist > 1e-4) {
        _cross.crossVectors(_fwd, _toT);
        dev = _cross.length() / dist;
        if (state.currentTaskType === 'tracking' && dev < TRACK_THRESH_RAD) onTarget = true;
      }
    }
    if (state.currentTaskType === 'tracking' && state.testActive) {
      state.trackTotal++;
      if (onTarget) state.trackOnTarget++;
    }
    if (state.graphEnabled) {
      state.graphOmega[state.graphIdx] = omega;
      state.graphDist[state.graphIdx] = dist;
      state.graphIdx = (state.graphIdx + 1) % state.graphOmega.length;
    }
    telemetry.t[n] = now;
    telemetry.qx[n] = q.x; telemetry.qy[n] = q.y; telemetry.qz[n] = q.z; telemetry.qw[n] = q.w;
    telemetry.w[n] = omega; telemetry.a[n] = alpha;
    telemetry.dev[n] = dev; telemetry.dist[n] = dist;
    telemetry.n = n + 1;
    _prevQ.copy(q); _prevTime = now; _prevLogged = true;
  }

  function animate() {
    if (!state.renderer || !state.scene || !state.camera) return;
    state.animId = requestAnimationFrame(animate);
    var now = performance.now();
    if (state.testActive && state.currentTaskType === 'tracking' && state.target) {
      var elapsed = (now - state.testStartTime) / 1000;
      state.target.position.x = state.trackBaseX + state.trackAmpX * Math.sin(elapsed * state.trackFx * Math.PI * 2);
      state.target.position.y = state.trackBaseY + state.trackAmpY * Math.sin(elapsed * state.trackFy * Math.PI * 2 + state.trackPhase);
    }
    if (state.testActive) logFrame(now);
    if (state.graphEnabled && state.graphCanvas && (now - state.graphLastRender) > GRAPH_UPDATE_MS) {
      state.graphLastRender = now;
      drawRealtimeGraph();
    }
    state.renderer.render(state.scene, state.camera);
  }

  /* ===== INPUT ===== */
  function setupGlobalInputHandlers() {
    document.addEventListener('mousemove', function(e){
      if (!state.testActive || !state.camera) return;
      if (!isPointerLocked()) return;
      applyLook(e.movementX, e.movementY);
    });
    document.addEventListener('mousedown', function(e){
      if (!state.testActive || !state.camera) return;
      if (!isPointerLocked()) return;
      if (e.button !== undefined && e.button !== 0) return;
      AudioSys.shoot();
      if (!state.target) return;
      state.raycaster.setFromCamera({ x: 0, y: 0 }, state.camera);
      var hits = state.raycaster.intersectObject(state.target);
      var ch = document.getElementById('crosshair-container');
      if (hits.length > 0) {
        state.testHits++;
        state.streak++;
        if (state.streak >= 3) showStreak(state.streak);
        AudioSys.hit();
        var dist = hits[0].distance;
        var wgt = 1 + 0.6 * clamp((dist - 8) / 8, 0, 1);
        state.testWeightedHits += wgt;
        if (ch) ch.classList.remove('miss');
        if (state.currentTaskType !== 'tracking') spawnTarget();
        else { state.targetSpawnTime = performance.now(); state.targetReacted = false; }
      } else {
        state.testMisses++;
        state.streak = 0;
        var sb = document.getElementById('streak-badge'); if (sb) sb.classList.remove('on');
        AudioSys.miss();
        if (ch) { ch.classList.add('miss'); setTimeout(function(){ ch.classList.remove('miss'); }, 80); }
        if (state.missData.length < 200) {
          _fwd.set(0, 0, -1).applyQuaternion(state.camera.quaternion);
          _toT.copy(state.target.position).sub(state.camera.position).normalize();
          _right.set(1, 0, 0).applyQuaternion(state.camera.quaternion);
          _up.set(0, 1, 0).applyQuaternion(state.camera.quaternion);
          var dx = _toT.dot(_right), dy = _toT.dot(_up), fz = _toT.dot(_fwd);
          state.missData.push({ x: Math.atan2(dx, fz) * 180 / Math.PI, y: Math.atan2(dy, fz) * 180 / Math.PI });
        }
      }
    });
    document.addEventListener('pointerlockchange', function(){
      if (!state.testActive) return;
      if (!isPointerLocked()) pauseTest('Pointer lock terlepas.');
    });
    window.addEventListener('blur', function(){
      if (state.testActive) pauseTest('Jendela kehilangan fokus.');
    });
    document.addEventListener('visibilitychange', function(){
      if (document.hidden && state.testActive) pauseTest('Tab tidak aktif.');
    });
    document.addEventListener('keydown', function(e){
      if (state.screen !== 'test') return;
      if (e.code === 'KeyM') { e.preventDefault(); toggleSound(); }
      if (e.code === 'KeyG') {
        e.preventDefault();
        state.graphEnabled = !state.graphEnabled;
        saveCurrentToProfile();
        var c = document.getElementById('realtime-graph');
        if (c) c.classList.toggle('on', state.graphEnabled);
        if (state.graphEnabled && !state.graphCanvas) initRealtimeGraph();
      }
    });
    window.addEventListener('resize', resizeScene);
  }

  /* ===== CLEANUP / FINISH ===== */
  function cleanupTest() {
    state.testActive = false;
    if (state.hudTimer) { clearInterval(state.hudTimer); state.hudTimer = null; }
    if (state.testTimer) { clearTimeout(state.testTimer); state.testTimer = null; }
    if (state.target && state.scene) { state.scene.remove(state.target); state.target = null; }
    state.trialResolve = null;
    releasePointerLock();
  }

  async function finishPSA() {
    cleanupTest();
    if (state.renderer) {
      cancelAnimationFrame(state.animId);
      state.renderer.domElement.remove();
      state.renderer.dispose();
      state.renderer = null;
    }
    state.screen = 'results';

    var best = null, i;
    for (i = 0; i < state.trials.length; i++) {
      var t = state.trials[i];
      if (t.valid && (!best || t.score > best.score)) best = t;
    }

    var opt;
    if (state.observations.length >= 3) {
      opt = await requestOptimize();
      opt.sufficient = true;
    } else {
      opt = {
        edpi: best ? best.edpi : state.baseEdpi,
        score: best ? best.score : 0,
        variance: 0, sufficient: false
      };
    }
    /* Convert optimal eDPI → sens at user's DPI */
    opt.sens = opt.edpi / state.dpi;
    opt.dpi = state.dpi;
    state.optimum = opt;

    /* Save session */
    var game = GAMES[state.game];
    var sigma = Math.sqrt(Math.max(0, opt.variance || 0));
    var conf = !opt.sufficient ? 'insufficient' : (sigma < 6 ? 'high' : (sigma < 12 ? 'mid' : 'low'));
    var maxScore = 0;
    for (var k = 0; k < state.trials.length; k++) if (state.trials[k].valid && state.trials[k].score > maxScore) maxScore = state.trials[k].score;
    var prevSession = sessionHistory.length > 0 ? sessionHistory[sessionHistory.length - 1] : null;
    pushHistory({
      ts: Date.now(),
      game: state.game,
      gameLabel: game.label,
      sens: opt.sens,
      dpi: opt.dpi,
      edpi: opt.edpi,
      cm360: cm360(opt.sens, opt.dpi, game.yaw),
      bestScore: maxScore,
      confidence: conf,
      distanceMode: state.distanceMode,
      taskMix: state.taskMix,
      hFov: state.hFov,
      prevEdpi: prevSession ? prevSession.edpi : null
    });
    renderResults();
  }

  /* ===== RESULTS ===== */
  function renderResults() {
    body.classList.remove('no-scroll');
    var game = GAMES[state.game];
    var opt = state.optimum;
    var trials = state.trials;
    var optimalSens = opt.sens;
    var optimalEdpi = opt.edpi;
    var optimalDpi = state.dpi;
    var cms = cm360(optimalSens, optimalDpi, game.yaw);

    var sigma = Math.sqrt(Math.max(0, opt.variance || 0));
    var conf;
    if (!opt.sufficient) conf = 'data belum cukup';
    else if (sigma < 6)  conf = 'tinggi';
    else if (sigma < 12) conf = 'sedang';
    else                 conf = 'rendah';

    var bestScore = 0, i;
    for (i = 0; i < trials.length; i++) if (trials[i].valid && trials[i].score > bestScore) bestScore = trials[i].score;
    var maxScore = 1;
    for (i = 0; i < trials.length; i++) if (trials[i].score > maxScore) maxScore = trials[i].score;

    /* Grade */
    var grade = bestScore >= 75 ? 'S' : bestScore >= 65 ? 'A' : bestScore >= 55 ? 'B' : bestScore >= 45 ? 'C' : 'D';

    /* Session compare */
    var prevSession = sessionHistory.length >= 2 ? sessionHistory[sessionHistory.length - 2] : null;
    var deltaHtml = '';
    if (prevSession && prevSession.edpi) {
      var deltaEdpi = optimalEdpi - prevSession.edpi;
      var deltaPct = (deltaEdpi / prevSession.edpi) * 100;
      var cls = Math.abs(deltaPct) < 3 ? 'pos' : (deltaPct > 0 ? 'neg' : 'pos');
      var sign = deltaPct >= 0 ? '+' : '';
      deltaHtml = '<div class="v-recommend-delta ' + cls + '">' +
        icon('chart', 12) + 'vs sesi lalu: ' + sign + deltaPct.toFixed(1) + '% (' + sign + Math.round(deltaEdpi) + ' eDPI)' +
        '</div>';
    }

    /* Convergence bars */
    var runningBest = 0;
    var convBars = trials.map(function(t, idx){
      if (t.valid && t.score > runningBest) runningBest = t.score;
      var range = state.edpiMax - state.edpiMin;
      var edpiPct = range > 0 ? clamp((t.edpi - state.edpiMin) / range, 0, 1) * 100 : 50;
      var fillPct = clamp(runningBest, 0, 100);
      var dim = t.valid ? '' : ';opacity:0.22';
      return '<div class="v-bar-row">' +
        '<div class="v-bar-label">' + (t.warmup ? 'W' : 'T' + (idx + 1)) + ' · ' + Math.round(t.edpi) + '</div>' +
        '<div class="v-bar-track" style="position:relative;">' +
          '<div class="v-bar-fill" style="position:absolute;left:0;top:0;bottom:0;width:' + fillPct + '%' + dim + ';"></div>' +
          '<div style="position:absolute;left:' + edpiPct + '%;top:-2px;bottom:-2px;width:2px;background:var(--v-teal);"></div>' +
        '</div>' +
        '<div class="v-bar-val">' + t.score.toFixed(0) + '</div>' +
      '</div>';
    }).join('');

    /* Score bars */
    var scoreBars = trials.map(function(t, idx){
      var pct = maxScore > 0 ? (t.score / maxScore) * 100 : 0;
      var isBest = (t.valid && t.score === bestScore);
      return '<div class="v-bar-row">' +
        '<div class="v-bar-label">' + (t.warmup ? 'W' : 'T' + (idx + 1)) + ' ' + Math.round(t.edpi) +
          '<span style="color:var(--v-muted-2);"> ' + (t.taskType.charAt(0).toUpperCase()) + '</span></div>' +
        '<div class="v-bar-track"><div class="v-bar-fill teal" style="width:' + pct + '%' + (isBest ? '' : ';opacity:0.5') + (t.valid ? '' : ';background:#2a3844') + '"></div></div>' +
        '<div class="v-bar-val">' + t.score.toFixed(0) + '</div></div>';
    }).join('');

    /* Table */
    var tableRows = trials.map(function(t){
      var mark = t.valid ? '' : ' ✕';
      var taskCode = t.taskType.charAt(0).toUpperCase();
      return '<tr' + (t.valid && t.score === bestScore ? ' class="best"' : '') + (t.valid ? '' : ' class="invalid"') + '>' +
        '<td>' + (t.warmup ? 'W' : t.index) + mark + '</td>' +
        '<td>' + taskCode + '</td>' +
        '<td>' + Math.round(t.edpi) + '</td>' +
        '<td>' + t.sens.toFixed(4) + '</td>' +
        '<td>' + Math.round(t.dpi) + '</td>' +
        '<td>' + (t.accuracy * 100).toFixed(0) + '%</td>' +
        '<td>' + t.smoothness.toFixed(2) + '</td>' +
        '<td>' + t.deviation.toFixed(2) + '</td>' +
        '<td>' + t.rt.toFixed(0) + '</td>' +
        '<td>' + t.score.toFixed(1) + '</td></tr>';
    }).join('');

    /* Heatmap */
    var lastMiss = [];
    for (var mm = state.trials.length - 1; mm >= 0; mm--) {
      var tt = state.trials[mm];
      if (tt.valid && tt.missData && tt.missData.length > 0) { lastMiss = tt.missData; break; }
    }
    var heatmapSvg = renderHeatmapSVG(lastMiss);

    var validCount = state.observations.length;

    body.innerHTML =
      '<div class="v-container">' +

        '<div class="v-hero">' +
          '<div class="v-title">Optimization Complete</div>' +
          '<div class="v-sub">' + game.label + ' · ' + TASK_MODES[state.taskMix].label + ' · ' + DISTANCE_MODES[state.distanceMode].label + ' · FOV ' + state.hFov + '° · ' + validCount + '/' + TOTAL_TRIALS + ' trials valid</div>' +
        '</div>' +

        '<div class="v-grid-2" style="grid-template-columns: 2fr 1fr; align-items: stretch;">' +
          '<div class="v-recommend">' +
            '<div class="v-recommend-label">' + icon('zap', 12) + 'Recommended Sens</div>' +
            '<div class="v-recommend-value">' + optimalSens.toFixed(4) + '</div>' +
            '<div class="v-recommend-sub">@ ' + Math.round(optimalDpi) + ' DPI · eDPI ' + Math.round(optimalEdpi) + ' · ' + cms.toFixed(1) + ' cm/360° · confidence: ' + conf + '</div>' +
            deltaHtml +
          '</div>' +
          '<div class="v-panel neutral" style="justify-content:center; align-items:center; text-align:center; gap:8px;">' +
            '<div class="v-label" style="margin-bottom:0;">Session Grade</div>' +
            '<div class="v-grade">' + grade + '</div>' +
            '<div class="v-panel-sub" style="margin-left:0;">Best score: ' + bestScore.toFixed(1) + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="v-grid-2" style="align-items:start;">' +

          '<div class="v-panel hollow">' +
            '<div class="v-panel-header">' + icon('chart', 16) + '<div class="v-panel-title">Convergence</div></div>' +
            '<div class="v-sub" style="font-size:11.5px;">Bar = best-so-far. Marker cyan = posisi eDPI diuji. Range: ' + Math.round(state.edpiMin) + ' – ' + Math.round(state.edpiMax) + '.</div>' +
            '<div class="v-bars">' + convBars + '</div>' +
          '</div>' +

          '<div class="v-panel hollow">' +
            '<div class="v-panel-header">' + icon('target', 16) + '<div class="v-panel-title">Miss Heatmap</div>' +
              '<div class="v-panel-sub">' + lastMiss.length + ' shots</div></div>' +
            '<div class="v-heatmap-wrap">' +
              heatmapSvg +
              '<div class="v-heatmap-legend">' +
                '<div style="color:var(--v-muted); font-size:11px;">Posisi crosshair saat miss (derajat dari center).</div>' +
                '<div class="v-legend-row"><div class="v-legend-dot" style="background:var(--v-red);"></div><span>Miss</span></div>' +
                '<div class="v-legend-row"><div class="v-legend-dot" style="background:var(--v-teal);"></div><span>Target</span></div>' +
              '</div>' +
            '</div>' +
          '</div>' +

        '</div>' +

        '<div class="v-panel hollow">' +
          '<div class="v-panel-header">' + icon('chart', 16) + '<div class="v-panel-title">Score per Trial</div></div>' +
          '<div class="v-bars">' + scoreBars + '</div>' +
        '</div>' +

        '<div class="v-panel hollow">' +
          '<div class="v-panel-header">' + icon('grid', 16) + '<div class="v-panel-title">Raw Data</div></div>' +
          '<div style="overflow-x:auto;">' +
            '<table class="v-table"><thead><tr><th>#</th><th>Task</th><th>eDPI</th><th>Sens</th><th>DPI</th><th>Acc</th><th>Smooth</th><th>Dev</th><th>RT</th><th>Score</th></tr></thead><tbody>' + tableRows + '</tbody></table>' +
          '</div>' +
        '</div>' +

        '<div class="' + (opt.sufficient ? 'v-info' : 'v-warn') + '">' +
          icon(opt.sufficient ? 'info' : 'alert', 16) +
          '<div>' +
            (opt.sufficient
              ? 'Optimizer bekerja di sumbu <strong>eDPI 1D</strong> — ini akar dari perbaikan dibanding versi sebelumnya. Karena rotasi FPS cuma bergantung pada eDPI, hasilnya <strong>tidak akan drift</strong> ke DPI acak. Kalau kamu ganti DPI hardware, sens harus diubah proporsional: <em>sens_baru = eDPI_optimal / DPI_baru</em>.'
              : '<strong>Data belum cukup.</strong> Hanya ' + validCount + ' trial valid dari ' + TOTAL_TRIALS + '. Ulangi dengan lebih fokus.') +
          '</div>' +
        '</div>' +

        '<div class="v-btn-row" style="justify-content:flex-end;">' +
          '<button class="v-btn ghost" id="sf-restart-btn">' + icon('refresh', 14) + 'Ulangi</button>' +
          '<button class="v-btn" id="sf-copy-btn">' + icon('copy', 14) + 'Copy ' + optimalSens.toFixed(4) + ' @ ' + Math.round(optimalDpi) + ' DPI</button>' +
        '</div>' +

        '<div class="v-disclaimer">Estimasi awal dari aim-test browser. Sesuaikan manual di game.</div>' +
      '</div>';

    document.getElementById('sf-copy-btn').addEventListener('click', function(){
      var txt = 'sens ' + optimalSens.toFixed(4) + ' @ ' + Math.round(optimalDpi) + ' DPI (eDPI ' + Math.round(optimalEdpi) + ')';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function(){
          var btn = document.getElementById('sf-copy-btn');
          var orig = btn.innerHTML;
          btn.innerHTML = icon('check', 14) + 'Tersalin';
          setTimeout(function(){ btn.innerHTML = orig; }, 1400);
        }).catch(function(){});
      }
    });
    document.getElementById('sf-restart-btn').addEventListener('click', returnToSetup);
  }

  function renderHeatmapSVG(misses) {
    var W = 220, H = 220, R = 100, CX = 110, CY = 110;
    var maxAngle = 10;
    var scale = R / maxAngle;
    var rings = '';
    for (var rr = 2; rr <= maxAngle; rr += 2) {
      rings += '<circle cx="' + CX + '" cy="' + CY + '" r="' + (rr * scale) + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>';
    }
    var cross = '<line x1="' + (CX - R) + '" y1="' + CY + '" x2="' + (CX + R) + '" y2="' + CY + '" stroke="rgba(255,255,255,0.08)"/>' +
                '<line x1="' + CX + '" y1="' + (CY - R) + '" x2="' + CX + '" y2="' + (CY + R) + '" stroke="rgba(255,255,255,0.08)"/>';
    var dots = misses.map(function(m) {
      var x = CX + clamp(m.x, -maxAngle, maxAngle) * scale;
      var y = CY - clamp(m.y, -maxAngle, maxAngle) * scale;
      return '<circle cx="' + x + '" cy="' + y + '" r="3" fill="rgba(255,70,85,0.75)" stroke="#ff4655" stroke-width="0.5"/>';
    }).join('');
    var center = '<circle cx="' + CX + '" cy="' + CY + '" r="4" fill="#00ffba"/>';
    return '<svg class="v-heatmap-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' + rings + cross + dots + center + '</svg>';
  }

  /* ===== BOOT ===== */
  function init() {
    state.worker = createWorker();
    brandIcon.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7 L20 7 L18 17 L6 17 Z"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>';
    setupGlobalInputHandlers();
    root.hidden = false;
    loader.classList.add('hidden');
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
