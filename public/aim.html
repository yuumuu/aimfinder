<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sens Finder 3D — Continuous AI Sensitivity Optimizer</title>
<meta name="theme-color" content="#0a0d11">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0d11'/><circle cx='16' cy='16' r='8' fill='none' stroke='%23e8a33d' stroke-width='2'/><circle cx='16' cy='16' r='2' fill='%23e8a33d'/></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0d11; }

  :root {
    --bg: #0a0d11; --bg-2: #0d1116;
    --panel: #12161c; --panel-2: #171c24; --panel-3: #1c222b;
    --line: #232a34; --line-2: #2c3441;
    --text: #e6e9ee; --text-2: #b8c0cc;
    --muted: #7c8797; --muted-2: #5a6473;
    --accent: #e8a33d; --accent-2: #45d6c4; --accent-3: #6ba6ff;
    --danger: #ff5d5d; --success: #4ade80;
    --mono: 'JetBrains Mono', 'Consolas', 'SFMono-Regular', 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    --radius-sm: 6px; --radius: 10px; --radius-lg: 14px;
  }

  /* ============ LOADER ============ */
  #sf-loader {
    position: fixed; inset: 0; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: #0a0d11; color: #e6e9ee; font-family: var(--mono);
    transition: opacity .4s, visibility .4s;
  }
  #sf-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #sf-loader .spinner {
    width: 36px; height: 36px; border: 2px solid #232a34; border-top-color: #e8a33d;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #sf-loader .brand { font-weight: 700; letter-spacing: 3px; font-size: 14px; color: #e8a33d; }
  #sf-loader .status { font-size: 12px; color: #7c8797; }

  /* ============ ROOT ============ */
  #sf-root {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    background: var(--bg); color: var(--text);
    font-family: var(--sans);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #sf-root * { box-sizing: border-box; }

  /* ============ HEADER ============ */
  .sf-header {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--bg-2), var(--bg));
    z-index: 20;
  }
  .sf-brand {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-weight: 700; letter-spacing: 2px;
    font-size: 13px; color: var(--accent); text-transform: uppercase;
  }
  .sf-brand .brand-mark {
    width: 26px; height: 26px; border-radius: 6px;
    background: rgba(232, 163, 61, 0.1);
    border: 1px solid rgba(232, 163, 61, 0.3);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .sf-brand .brand-sub { color: var(--muted); font-weight: 400; margin-left: 2px; }
  .sf-header-actions { display: flex; align-items: center; gap: 8px; }
  .sf-icon-btn {
    width: 34px; height: 34px; border-radius: 8px;
    background: transparent; border: 1px solid var(--line);
    color: var(--text-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .sf-icon-btn:hover { background: var(--panel-2); border-color: var(--line-2); color: var(--text); }
  .sf-icon-btn:active { transform: scale(.95); }

  /* ============ BODY ============ */
  .sf-body {
    flex: 1; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: 24px;
    display: flex; flex-direction: column;
  }
  .sf-body.no-scroll { overflow: hidden; padding: 0; }
  .sf-body::-webkit-scrollbar { width: 10px; }
  .sf-body::-webkit-scrollbar-track { background: transparent; }
  .sf-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  .sf-body::-webkit-scrollbar-thumb:hover { background: var(--line-2); }

  .sf-container { max-width: 1180px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  /* ============ TYPOGRAPHY ============ */
  .sf-title { font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .sf-sub { color: var(--text-2); font-size: 13.5px; line-height: 1.65; }
  .sf-sub strong { color: var(--text); font-weight: 600; }
  .sf-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); font-family: var(--mono); font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .sf-label .sf-icon { color: var(--muted); }
  .kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; padding: 0 6px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 700;
    background: var(--panel-3); color: var(--text);
    border: 1px solid var(--line-2); border-bottom-width: 2px;
    border-radius: 5px;
  }

  /* ============ CARDS ============ */
  .sf-card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius-lg); padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .sf-card-header {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .sf-card-header .sf-icon { color: var(--accent); }
  .sf-card-title { font-size: 13.5px; font-weight: 600; letter-spacing: .3px; }
  .sf-card-sub { font-size: 11.5px; color: var(--muted); margin-left: auto; font-family: var(--mono); }

  .sf-hero { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }
  .sf-hero .sf-title { font-size: 26px; }

  /* ============ FORM ============ */
  .sf-field { display: flex; flex-direction: column; gap: 7px; }
  .sf-input, .sf-textarea {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 10px 12px; border-radius: var(--radius-sm);
    font-family: var(--mono); font-size: 13.5px; outline: none;
    transition: border-color .15s, box-shadow .15s; width: 100%;
  }
  .sf-input:focus, .sf-textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232, 163, 61, 0.12);
  }
  .sf-textarea { resize: vertical; min-height: 60px; font-size: 12.5px; line-height: 1.5; }
  .sf-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ============ BUTTONS ============ */
  .sf-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--accent); color: #1a1305; border: none;
    padding: 11px 20px; border-radius: var(--radius-sm);
    font-weight: 700; font-size: 13.5px; cursor: pointer;
    letter-spacing: .2px; font-family: var(--sans);
    transition: transform .1s, filter .15s, box-shadow .15s;
    white-space: nowrap;
  }
  .sf-btn:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 4px 14px rgba(232, 163, 61, 0.25); }
  .sf-btn:active:not(:disabled) { transform: scale(.98); }
  .sf-btn:disabled { opacity: .35; cursor: not-allowed; }
  .sf-btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--line-2); }
  .sf-btn.secondary:hover:not(:disabled) { background: var(--panel-2); box-shadow: none; }
  .sf-btn.ghost { background: transparent; color: var(--text-2); border: 1px solid var(--line); }
  .sf-btn.ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--text); box-shadow: none; }
  .sf-btn.danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,93,93,0.3); }
  .sf-btn.danger:hover:not(:disabled) { background: rgba(255,93,93,0.08); box-shadow: none; }
  .sf-btn.large { padding: 14px 26px; font-size: 14.5px; border-radius: var(--radius); }
  .sf-btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  .sf-error { color: var(--danger); font-size: 12.5px; min-height: 18px; }

  /* ============ RADIO / GAME SELECT ============ */
  .sf-radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
  .sf-radio {
    border: 1px solid var(--line); background: var(--panel-2);
    padding: 12px 14px; border-radius: var(--radius);
    cursor: pointer; flex: 1; min-width: 130px;
    transition: all .15s; text-align: center; user-select: none;
  }
  .sf-radio:hover { border-color: var(--line-2); background: var(--panel-3); }
  .sf-radio.selected {
    border-color: var(--accent); background: rgba(232, 163, 61, 0.08);
    box-shadow: 0 0 0 3px rgba(232, 163, 61, 0.1);
  }
  .sf-radio-title { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; }
  .sf-radio-desc { font-size: 11px; color: var(--muted); font-family: var(--mono); }

  /* ============ TABS ============ */
  .sf-tabs {
    display: flex; gap: 4px; padding: 4px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }
  .sf-tab {
    flex: 1; padding: 7px 12px; border-radius: 5px;
    background: transparent; border: none; color: var(--muted);
    font-size: 12px; font-family: var(--mono); font-weight: 600;
    letter-spacing: .5px; cursor: pointer; transition: all .15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .sf-tab:hover { color: var(--text-2); }
  .sf-tab.active { background: var(--panel); color: var(--accent); }

  /* ============ CROSSHAIR ============ */
  .sf-crosshair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .sf-crosshair-preview {
    background: radial-gradient(ellipse at center, #1a1f28 0%, #0a0d11 100%);
    border: 1px solid var(--line); border-radius: var(--radius);
    min-height: 180px; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .sf-crosshair-preview::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 20px 20px; pointer-events: none;
  }
  .sf-crosshair-preview > svg { position: relative; z-index: 1; }

  .sf-slider-row { display: flex; align-items: center; gap: 10px; }
  .sf-slider-label { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 90px; flex-shrink: 0; }
  .sf-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; background: var(--panel-3); border-radius: 2px; outline: none; cursor: pointer; }
  .sf-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--accent); }
  .sf-slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--bg); }
  .sf-slider-val { font-family: var(--mono); font-size: 11px; color: var(--text-2); width: 34px; text-align: right; flex-shrink: 0; }

  .sf-toggle-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sf-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: var(--radius-sm);
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--muted); font-size: 12px; cursor: pointer;
    transition: all .15s; user-select: none;
  }
  .sf-toggle:hover { border-color: var(--line-2); color: var(--text-2); }
  .sf-toggle.active { background: rgba(232, 163, 61, 0.1); border-color: var(--accent); color: var(--accent); }
  .sf-toggle-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-2); transition: background .15s; }
  .sf-toggle.active .sf-toggle-dot { background: var(--accent); }

  .sf-color-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .sf-color-swatch {
    width: 26px; height: 26px; border-radius: 6px;
    border: 2px solid transparent; cursor: pointer;
    transition: all .15s; position: relative;
  }
  .sf-color-swatch:hover { transform: scale(1.08); }
  .sf-color-swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--text); }

  /* ============ INFO / WARN ============ */
  .sf-info {
    background: rgba(107, 166, 255, 0.06); border: 1px solid rgba(107, 166, 255, 0.25);
    border-radius: var(--radius); padding: 12px 14px;
    font-size: 12.5px; line-height: 1.6; color: var(--text-2);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .sf-info .sf-icon { color: var(--accent-3); flex-shrink: 0; margin-top: 1px; }
  .sf-warn {
    border: 1px solid #6b5420; background: rgba(232, 163, 61, 0.06);
    padding: 12px 14px; border-radius: var(--radius);
    font-size: 12.5px; color: var(--accent); line-height: 1.6;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .sf-warn .sf-icon { flex-shrink: 0; margin-top: 1px; }

  /* ============ KEYBOARD SHORTCUTS ============ */
  .sf-shortcuts { display: flex; gap: 16px; flex-wrap: wrap; }
  .sf-shortcut { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }

  /* ============ TEST SCREEN ============ */
  #scene-wrap {
    position: absolute; inset: 0;
    overflow: hidden; background: #05070a;
    display: flex; align-items: center; justify-content: center;
    z-index: 0;
  }
  #scene-wrap canvas { display: block; width: 100% !important; height: 100% !important; }

  #crosshair-container {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 10;
    display: flex; align-items: center; justify-content: center;
  }
  #crosshair-container.miss > svg rect,
  #crosshair-container.miss > svg circle { fill: var(--danger) !important; }

  .sf-hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 16px 22px; z-index: 5;
    pointer-events: none;
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .sf-hud .hud-item { display: flex; flex-direction: column; gap: 3px; }
  .sf-hud .hud-label { font-size: 9.5px; letter-spacing: 1.5px; color: var(--muted-2); text-transform: uppercase; }
  .sf-hud .hud-value { font-size: 15px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .sf-hud .hud-value.accent { color: var(--accent); }
  .sf-hud .hud-center { text-align: center; }
  .sf-hud .hud-right { text-align: right; align-items: flex-end; }

  .sf-timer-bar {
    position: absolute; top: 0; left: 0; height: 3px;
    background: var(--accent); z-index: 6;
    transition: width .1s linear;
    box-shadow: 0 0 12px rgba(232, 163, 61, 0.6);
  }
  .sf-timer-big {
    position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 60px; font-weight: 700;
    color: rgba(230, 233, 238, 0.10); letter-spacing: -3px;
    z-index: 4; pointer-events: none; font-variant-numeric: tabular-nums;
    transition: color .3s;
  }
  .sf-timer-big.warning { color: rgba(255, 93, 93, 0.25); }

  .sf-countdown-big {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--mono); font-size: 160px; font-weight: 800;
    color: var(--accent); z-index: 12; pointer-events: none;
    text-shadow: 0 0 40px rgba(232, 163, 61, 0.5);
    opacity: 0;
  }
  .sf-countdown-big.show { animation: cd-pop .7s cubic-bezier(.2, .8, .3, 1); }
  @keyframes cd-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
    40% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
  }

  /* ============ OVERLAY ============ */
  #test-overlay {
    position: absolute; inset: 0; z-index: 15;
    background: rgba(5, 7, 10, 0.88);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; text-align: center;
    padding: 40px 32px; overflow-y: auto;
    transition: opacity .25s;
  }
  #test-overlay.hidden { display: none; }
  .overlay-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 20px;
    background: rgba(232, 163, 61, 0.1);
    border: 1px solid rgba(232, 163, 61, 0.3);
    color: var(--accent);
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 1.5px; font-weight: 600; text-transform: uppercase;
  }
  .overlay-badge.success { background: rgba(74, 222, 128, 0.1); border-color: rgba(74, 222, 128, 0.3); color: var(--success); }
  .overlay-badge.danger { background: rgba(255, 93, 93, 0.1); border-color: rgba(255, 93, 93, 0.3); color: var(--danger); }
  .overlay-title { font-size: 28px; font-weight: 700; letter-spacing: -.01em; max-width: 560px; line-height: 1.25; }
  .overlay-desc { color: var(--text-2); font-size: 14px; max-width: 520px; line-height: 1.65; }
  .overlay-stats {
    display: flex; gap: 28px; margin: 4px 0 8px;
    padding: 14px 24px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--line); border-radius: var(--radius);
  }
  .overlay-stat { display: flex; flex-direction: column; gap: 3px; align-items: center; }
  .overlay-stat-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 1.5px; color: var(--muted-2); text-transform: uppercase; }
  .overlay-stat-value { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .overlay-stat-value.accent { color: var(--accent); }
  .overlay-hint {
    display: flex; align-items: center; gap: 8px;
    color: var(--text-2); font-size: 13px;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
  }

  /* ============ PAUSE MENU ============ */
  .pause-actions {
    display: flex; flex-direction: column; gap: 8px;
    width: 100%; max-width: 340px; margin-top: 8px;
    text-align: left;
  }
  .pause-actions .sf-btn {
    justify-content: flex-start;
    padding: 12px 20px; width: 100%; text-align: left;
  }
  .pause-error {
    color: var(--danger); font-size: 12px;
    min-height: 16px; font-family: var(--mono);
    margin-top: 4px;
  }
  .pause-crosshair {
    display: grid; grid-template-columns: 180px 1fr; gap: 20px;
    width: 100%; max-width: 620px;
    padding: 16px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--line); border-radius: var(--radius);
    text-align: left;
  }
  .pause-ch-preview {
    background: radial-gradient(ellipse at center, #1a1f28 0%, #0a0d11 100%);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    min-height: 160px; display: flex; align-items: center; justify-content: center;
  }
  .pause-ch-controls { display: flex; flex-direction: column; gap: 10px; }
  @media (max-width: 640px) {
    .pause-crosshair { grid-template-columns: 1fr; }
  }

  /* ============ RESULTS ============ */
  .sf-recommend {
    border: 1px solid var(--accent);
    background: linear-gradient(135deg, rgba(232, 163, 61, 0.08), rgba(232, 163, 61, 0.02));
    border-radius: var(--radius-lg); padding: 22px 24px;
  }
  .sf-recommend .sf-label { color: var(--accent); margin-bottom: 4px; }
  .sf-recommend-value {
    font-family: var(--mono); font-size: 38px; font-weight: 700;
    letter-spacing: -.02em; margin: 6px 0 4px; color: var(--text);
  }
  .sf-recommend-sub { font-size: 13px; color: var(--text-2); font-family: var(--mono); }

  .sf-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  .sf-table th, .sf-table td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; }
  .sf-table th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: .8px; background: var(--panel-2); position: sticky; top: 0; }
  .sf-table tr.best td { background: rgba(69, 214, 196, 0.06); }
  .sf-table tr.best td:first-child { color: var(--accent-2); font-weight: 700; }
  .sf-table tr.invalid td { opacity: .4; }

  .sf-bars { display: flex; flex-direction: column; gap: 8px; }
  .sf-bar-row { display: flex; align-items: center; gap: 10px; }
  .sf-bar-label { font-family: var(--mono); font-size: 11px; width: 70px; color: var(--muted); flex-shrink: 0; }
  .sf-bar-track { flex: 1; height: 14px; background: var(--panel-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
  .sf-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width .6s; }

    var io = Math.max(0, cfg.innerOffset);
    var ot = Math.max(0, cfg.outerThickness);
    var ol = Math.max(0, cfg.outerLength);
    var oo = Math.max(0, cfg.outerOffset);
    var parts = [];

      var oGap = io + il + oo, oStart = oGap, oEnd = oGap + ol;

      parts.push(rect(cx + oStart, cy - ot/2, ol, ot, cfg.color, stroke, sw));

      parts.push(rect(cx - it/2, cy + start, it, il, cfg.color, stroke, sw));
      parts.push(rect(cx - end, cy - it/2, il, it, cfg.color, stroke, sw));

  /* =========================================================================

    var i, j, s, d, r, maxV = -1e18;
    for (i = 0; i <= NI; i++) {

        d = ranges.dpiMin + j * dStep;
        r = kRegress(obs, s, d, ss, sd);
        grid[i * W + j] = r.mean;
        if (r.mean > maxV) maxV = r.mean;
      }
    }
    var bestI = 0, bestJ = 0, bestD = Infinity;
    for (i = 0; i <= NI; i++) for (j = 0; j <= NJ; j++) {
      if (grid[i * W + j] < maxV - tol) continue;
      d = ranges.dpiMin + j * dStep;
      var dd = Math.abs(d - anchorDpi);
      if (dd < bestD) { bestD = dd; bestI = i; bestJ = j; }
    }
    var bs = ranges.sensMin + bestI * sStep;
    var bd = ranges.dpiMin + bestJ * dStep;
    var best = { sens: bs, dpi: bd, score: grid[bestI * W + bestJ] };
    var fs = sStep / 10, fd = dStep / 10;
    for (i = -10; i <= 10; i++) {
      s = bs + i * fs;
      if (s < ranges.sensMin || s > ranges.sensMax) continue;
      for (j = -10; j <= 10; j++) {
        d = bd + j * fd;
        if (d < ranges.dpiMin || d > ranges.dpiMax) continue;
        r = kRegress(obs, s, d, ss, sd);
        if (r.mean > best.score + 1e-9) best = { sens: s, dpi: d, score: r.mean };

    best.variance = ru.variance; best.weight = ru.weight;
    return best;
  }

    var rD = ranges.dpiMax - ranges.dpiMin;
    if (!obs || obs.length === 0) {
      return { sens: ranges.sensMin + Math.random() * rS, dpi: ranges.dpiMin + Math.random() * rD };
    }
    var best = null, bestU = -Infinity;
    for (var i = 0; i < 800; i++) {
      var s = ranges.sensMin + Math.random() * rS;
      var d = ranges.dpiMin + Math.random() * rD;
      var reg = kRegress(obs, s, d, ss, sd);
      var dmin = Infinity;
      for (var j = 0; j < obs.length; j++) {

      }
      dmin = Math.sqrt(dmin);
      var u = reg.mean + kappa * dmin;
      if (u > bestU) { bestU = u; best = { sens: s, dpi: d }; }

  /* Wait until pointer lock engages on our canvas, or timeout. */
  function waitForLock(timeout) {
    return new Promise(function(resolve){
      var canvas = state.renderer && state.renderer.domElement;
      if (!canvas) { resolve(false); return; }
      if (document.pointerLockElement === canvas) { resolve(true); return; }
      var resolved = false;
      function done(v) {
        if (resolved) return;
        resolved = true;
        document.removeEventListener('pointerlockchange', onChange);
        document.removeEventListener('pointerlockerror', onError);
        clearTimeout(t);
        resolve(v);
      }
      function onChange() { if (document.pointerLockElement === canvas) done(true); }
      function onError()  { done(false); }
      document.addEventListener('pointerlockchange', onChange);
      document.addEventListener('pointerlockerror', onError);
      var t = setTimeout(function(){ done(false); }, timeout || 400);
    });
  }

  async function startOptimizer() {
    state.screen = 'test';
    setupTestUI();
    initScene();
    var wrap = document.getElementById('scene-wrap');
    wrap.insertBefore(state.renderer.domElement, wrap.firstChild);
    resizeScene();
    await runOptimizer();
  }

  /* =========================================================================
   *  MAIN LOOP
   * =======================================================================*/
  async function runOptimizer() {
    for (var i = 0; i < TOTAL_TRIALS; i++) {
      var pt = await pickPoint(i);

      while (true) {
        // INTRO (user clicks START -> pointer lock requested from gesture)
        await showTrialIntro(i + 1, pt);

        // Verify lock
        await sleep(80);
        if (!isPointerLocked()) {
          var action = await showPauseMenu('Pointer lock gagal aktif. Klik Resume untuk coba lagi.');
          if (action === 'restart_trial') continue;
          if (action === 'restart_session') { returnToSetup(); return; }
          if (action === 'exit')            { returnToSetup(); return; }
          continue;
        }

        // COUNTDOWN
        await showActiveCountdown();
        if (!isPointerLocked()) {
          // Lost during countdown
          var action2 = await showPauseMenu('Pointer lock terlepas sebelum tes dimulai.');
          if (action2 === 'restart_trial') continue;
          if (action2 === 'restart_session') { returnToSetup(); return; }
          if (action2 === 'exit')            { returnToSetup(); return; }
          continue;
        }

        // RUN
        var result = await runSingleTest(pt, i + 1);

        if (result === 'paused') {
          var action3 = await showPauseMenu(state.pauseReason);
          if (action3 === 'resume')          continue;
          if (action3 === 'restart_trial')   continue;
          if (action3 === 'restart_session') { returnToSetup(); return; }
          if (action3 === 'exit')            { returnToSetup(); return; }
          continue;
        }

        // SUCCESS
        registerTrial(result);
        releasePointerLock();
        await showTrialComplete(i + 1, result);
        break;
      }
    }
    finishPSA();
  }

  function returnToSetup() {
    cleanupTest();
    if (state.renderer) {
      cancelAnimationFrame(state.animId);
      state.renderer.domElement.remove();
      state.renderer.dispose();
      state.renderer = null;
    }
    state.trials = []; state.observations = []; state.optimum = null;
    state.screen = 'setup';
    render();
  }

  async function pickPoint(i) {
    var r = state.ranges;
    if (i === 0) {
      return { sens: clamp(state.baseSens, r.sensMin, r.sensMax), dpi: clamp(state.dpi, r.dpiMin, r.dpiMax) };
    }
    if (i <= EXPLORE_TRIALS) {
      if (i % 2 === 1 || state.observations.length === 0) {
        return { sens: rand(r.sensMin, r.sensMax), dpi: rand(r.dpiMin, r.dpiMax) };
      }
      var best = state.observations.reduce(function(a, b){ return b.score > a.score ? b : a; });
      var js = (r.sensMax - r.sensMin) * 0.16;
      var jd = (r.dpiMax  - r.dpiMin)  * 0.16;
      return {
        sens: clamp(gauss(best.sens, js), r.sensMin, r.sensMax),
        dpi:  clamp(gauss(best.dpi,  jd), r.dpiMin,  r.dpiMax)
      };
    }
    return await requestSuggest();
  }

  function registerTrial(t) {
    state.trials.push(t);
    if (t.valid) state.observations.push({ sens: t.sens, dpi: t.dpi, score: t.score });
  }

      var btn = document.getElementById('intro-start-btn');

        requestLockSync();

        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); start(); }
      }

      document.addEventListener('keydown', onKey);
    });

  function showActiveCountdown() {
    return new Promise(function(resolve){
      var el = document.getElementById('countdown-big');
      var i = ACTIVE_CD;
      function step() {
        if (i <= 0) { el.classList.remove('show'); resolve(); return; }
        el.textContent = i;
        el.classList.remove('show');
        void el.offsetWidth;
        el.classList.add('show');
        i--;
        setTimeout(step, 700);
      }
      step();
    });
  }

        resolved = true;
        document.removeEventListener('keydown', onKey);
        overlay.removeEventListener('click', finish);
        overlay.classList.add('hidden');
        resolve();
      }
      function onKey(e) { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); finish(); } }
      document.addEventListener('keydown', onKey);
      overlay.addEventListener('click', finish);
    });
  }

  /* =========================================================================
   *  TRIAL RUNNER
   * =======================================================================*/
  function runSingleTest(pt, round) {
    return new Promise(function(resolve){
      if (!isPointerLocked()) { resolve('paused'); state.pauseReason = 'Pointer lock tidak aktif.'; return; }

      resetTelemetry();
      state.testActive = true;
      state.testHits = 0;
      state.testMisses = 0;
      state.testWeightedHits = 0;
      state.testRt = [];
      state.testStartTime = performance.now();
      state.targetSpawnTime = 0;
      state.targetReacted = false;
      state.testSens = pt.sens;
      state.testDpi  = pt.dpi;
      state.yaw = 0;
      state.pitch = 0;
      state.hudTimer = null;
      state.testTimer = null;
      state.trialResolve = resolve;

      if (state.camera) state.camera.quaternion.set(0, 0, 0, 1);

      var hudHits  = document.getElementById('hud-hits');
      var hudTime  = document.getElementById('hud-time');
      var hudSens  = document.getElementById('hud-sens');
      var hudRound = document.getElementById('hud-round');
      var timerBar = document.getElementById('timer-bar');
      var timerBig = document.getElementById('timer-big');
      if (hudRound) hudRound.textContent = round;
      if (hudSens)  hudSens.textContent  = pt.sens.toFixed(4) + ' @ ' + Math.round(pt.dpi);

      spawnTarget();

      state.hudTimer = setInterval(function(){
        if (!state.testActive) return;
        var elapsed = performance.now() - state.testStartTime;
        var remaining = Math.max(0, (TEST_DURATION - elapsed) / 1000);
        var pct = clamp(elapsed / TEST_DURATION, 0, 1) * 100;
        if (hudHits) hudHits.textContent = state.testHits;
        if (hudTime) hudTime.textContent = Math.ceil(remaining);
        if (timerBar) timerBar.style.width = pct + '%';
        if (timerBig) {
          timerBig.textContent = Math.ceil(remaining);
          timerBig.classList.toggle('warning', remaining < 4);
        }
      }, 80);

      state.testTimer = setTimeout(function(){
        if (!state.testActive) return;
        state.testActive = false;
        if (state.hudTimer) { clearInterval(state.hudTimer); state.hudTimer = null; }
        if (state.target) { state.scene.remove(state.target); state.target = null; }
        state.trialResolve = null;
        resolve(computeTrialResult(pt, round));
      }, TEST_DURATION);
    });
  }

  function pauseTest(reason) {
    if (!state.testActive) return;
    state.testActive = false;
    state.pauseReason = reason;
    if (state.hudTimer) { clearInterval(state.hudTimer); state.hudTimer = null; }
    if (state.testTimer) { clearTimeout(state.testTimer); state.testTimer = null; }
    if (state.target) { state.scene.remove(state.target); state.target = null; }
    releasePointerLock();
    if (state.trialResolve) {
      var r = state.trialResolve;
      state.trialResolve = null;
      r('paused');
    }
  }

  /* =========================================================================
   *  METRICS
   * =======================================================================*/
  function computeTrialResult(pt, round) {
    var n = telemetry.n, i;
    var sum = 0, sum2 = 0, cnt = 0;
    for (i = 0; i < n; i++) {
      if (telemetry.w[i] < 0.2) continue;
      var a = telemetry.a[i];
      if (!isFinite(a)) continue;
      sum += a; sum2 += a * a; cnt++;
    }
    var meanA = cnt ? sum / cnt : 0;
    var varA  = cnt > 1 ? Math.max(0, sum2 / cnt - meanA * meanA) : 0;
    var sdA   = Math.sqrt(varA);
    var smoothness = 1 / (1 + sdA / SMOOTH_REF);

    var dsum = 0, dcnt = 0, depthSum = 0;
    for (i = 0; i < n; i++) {
      if (telemetry.dist[i] <= 0) continue;
      dsum += telemetry.dev[i]; depthSum += telemetry.dist[i]; dcnt++;
    }
    var devRad = dcnt ? dsum / dcnt : DEV_REF;
    var deviation = clamp(devRad / DEV_REF, 0, 1);
    var meanDepth = dcnt ? depthSum / dcnt : 0;

    var accuracy = (state.testWeightedHits + state.testMisses) > 0
      ? state.testWeightedHits / (state.testWeightedHits + state.testMisses) : 0;

    var meanRt = 1500;
    if (state.testRt.length) {
      var rs = 0;
      for (i = 0; i < state.testRt.length; i++) rs += state.testRt[i];
      meanRt = rs / state.testRt.length;
    }
    var rtNorm = clamp(meanRt / RT_REF, 0, 1);

    var raw = 0.40 * accuracy + 0.30 * smoothness - 0.20 * deviation - 0.10 * rtNorm;
    var score = clamp((raw + 0.30) * 100, 0, 100);

    var t = {
      index: round, sens: pt.sens, dpi: pt.dpi,
      accuracy: accuracy, smoothness: smoothness, deviation: deviation,
      rt: meanRt, rtNorm: rtNorm, score: score,
      hits: state.testHits, misses: state.testMisses,
      frames: n, maxGap: telemetry.maxGap, meanDepth: meanDepth, valid: false
    };
    t.valid = isValidTrial(t);
    return t;
  }

  function isValidTrial(t) {
    if (t.frames < 60) return false;
    if (t.maxGap > 0.40) return false;
    if (t.hits + t.misses < 4) return false;
    if (t.hits < 1) return false;
    if (t.accuracy < 0.10) return false;
    if (t.rt > 1500) return false;
    if (t.smoothness < 0.02) return false;
    return true;
  }

  /* =========================================================================
   *  WORKER
   * =======================================================================*/
  function createWorker() {
    try {
      var src =
        'var kKernel='   + kKernel.toString()   + ';\n' +
        'var kRegress='  + kRegress.toString()  + ';\n' +
        'var kOptimize=' + kOptimize.toString() + ';\n' +
        'var kAcquire='  + kAcquire.toString()  + ';\n' +
        'self.onmessage=function(e){' +
          'var m=e.data,res;' +
          'if(m.cmd==="optimize"){res=kOptimize(m.obs,m.ranges,m.ss,m.sd,m.anchorDpi,m.tol);}' +
          'else if(m.cmd==="suggest"){res=kAcquire(m.obs,m.ranges,m.ss,m.sd,m.kappa);}' +
          'self.postMessage({id:m.id,result:res});' +
        '};';
      var url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
      var w = new Worker(url);
      w.onmessage = function(e){
        var p = state.pending[e.data.id];
        if (p) { delete state.pending[e.data.id]; p.resolve(e.data.result); }
      };
      w.onerror = function(){
        state.worker = null;
        for (var id in state.pending) {
          var p = state.pending[id];
          delete state.pending[id];
          try { p.resolve(p.local()); } catch (err) { p.resolve(null); }
        }
      };
      return w;
    } catch (err) { return null; }
  }

  function requestSuggest() {
    return new Promise(function(resolve){
      var r = state.ranges;
      var local = function(){ return kAcquire(state.observations, r, SIGMA_S, SIGMA_D, UCB_KAPPA); };
      if (state.worker) {
        var id = ++state.reqId;
        state.pending[id] = { resolve: resolve, local: local };
        state.worker.postMessage({ cmd: 'suggest', id: id, obs: state.observations, ranges: r, ss: SIGMA_S, sd: SIGMA_D, kappa: UCB_KAPPA });
      } else resolve(local());
    });
  }

  function requestOptimize() {
    return new Promise(function(resolve){
      var r = state.ranges;
      var local = function(){ return kOptimize(state.observations, r, SIGMA_S, SIGMA_D, state.dpi, RIDGE_TOL); };
      if (state.worker) {
        var id = ++state.reqId;
        state.pending[id] = { resolve: resolve, local: local };
        state.worker.postMessage({ cmd: 'optimize', id: id, obs: state.observations, ranges: r, ss: SIGMA_S, sd: SIGMA_D, anchorDpi: state.dpi, tol: RIDGE_TOL });
      } else resolve(local());
    });
  }

  /* =========================================================================
   *  3D SCENE
   * =======================================================================*/
  var targetGeom = new THREE.SphereGeometry(0.55, 16, 16);
  var targetMat  = new THREE.MeshStandardMaterial({
    color: 0xe8a33d, emissive: 0xe8a33d, emissiveIntensity: 0.4, metalness: 0.3, roughness: 0.4
  });

  function spawnTarget() {
    if (!state.scene) return;
    if (state.target) state.scene.remove(state.target);
    state.target = new THREE.Mesh(targetGeom, targetMat);
    state.target.position.set(
      (Math.random() - 0.5) * 14,
      0.5 + Math.random() * 5,
      -8 - Math.random() * 7
    );
    state.scene.add(state.target);
    state.targetSpawnTime = performance.now();
    state.targetReacted = false;
  }

  function initScene() {
    if (state.renderer) { state.renderer.domElement.remove(); state.renderer.dispose(); }
    var wrap = document.getElementById('scene-wrap');
    if (!wrap) return;
    var w = wrap.clientWidth || window.innerWidth;
    var h = wrap.clientHeight || window.innerHeight;

    state.scene = new THREE.Scene();
    state.scene.background = new THREE.Color(0x05070a);
    state.scene.fog = new THREE.Fog(0x05070a, 25, 45);

    state.camera = new THREE.PerspectiveCamera(80, w / h, 0.1, 100);
    state.camera.position.set(0, 1.7, 0);
    state.camera.quaternion.set(0, 0, 0, 1);

    state.renderer = new THREE.WebGLRenderer({ antialias: true });
    state.renderer.setSize(w, h);
    state.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    state.scene.add(new THREE.AmbientLight(0x404060, 0.6));
    var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    state.scene.add(dirLight);
    var fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
    fillLight.position.set(-5, 5, -5);
    state.scene.add(fillLight);

    var grid = new THREE.GridHelper(40, 20, 0x1a2332, 0x1a2332);
    grid.position.y = -0.5;
    state.scene.add(grid);

    state.raycaster = new THREE.Raycaster();
    animate();
  }

  function resizeScene() {
    if (!state.renderer) return;
    var wrap = document.getElementById('scene-wrap');
    if (!wrap) return;
    var w = wrap.clientWidth, h = wrap.clientHeight;
    if (w > 0 && h > 0) {
      state.renderer.setSize(w, h);
      if (state.camera) {
        state.camera.aspect = w / h;
        state.camera.updateProjectionMatrix();
      }
    }
  }

  function logFrame(now) {
    var n = telemetry.n;
    if (n >= TELEM_CAP) return;
    var q = state.camera.quaternion;
    var omega = 0, alpha = 0;

    if (_prevLogged) {
      var dt = (now - _prevTime) / 1000;
      if (dt > telemetry.maxGap) telemetry.maxGap = dt;
      if (dt > 0.0005) {
        _prevQInv.copy(_prevQ).invert();
        _dq.copy(q).multiply(_prevQInv);
        var angle = 2 * Math.acos(clamp(Math.abs(_dq.w), 0, 1));
        var omegaRaw = angle / dt;
        _omegaEMA += 0.4 * (omegaRaw - _omegaEMA);
        var alphaRaw = (_omegaEMA - _prevOmegaEMA) / dt;
        _alphaEMA += 0.4 * (alphaRaw - _alphaEMA);
        _prevOmegaEMA = _omegaEMA;
        omega = _omegaEMA; alpha = _alphaEMA;
      }
    }

    if (state.target && !state.targetReacted && omega > RT_MOVE_THRESH) {
      state.targetReacted = true;
      state.testRt.push(now - state.targetSpawnTime);
    }

    var dist = 0, dev = 0;
    if (state.target) {
      _fwd.set(0, 0, -1).applyQuaternion(q);
      _toT.copy(state.target.position).sub(state.camera.position);
      dist = _toT.length();
      if (dist > 1e-4) {
        _cross.crossVectors(_fwd, _toT);
        dev = _cross.length() / dist;
      }
    }

    telemetry.t[n] = now;
    telemetry.qx[n] = q.x; telemetry.qy[n] = q.y;
    telemetry.qz[n] = q.z; telemetry.qw[n] = q.w;
    telemetry.w[n] = omega; telemetry.a[n] = alpha;
    telemetry.dev[n] = dev; telemetry.dist[n] = dist;
    telemetry.n = n + 1;

    _prevQ.copy(q);
    _prevTime = now;
    _prevLogged = true;
  }

  function animate() {
    if (!state.renderer || !state.scene || !state.camera) return;
    state.animId = requestAnimationFrame(animate);
    if (state.testActive) logFrame(performance.now());
    state.renderer.render(state.scene, state.camera);
  }

  /* =========================================================================
   *  INPUT HANDLERS
   * =======================================================================*/
  function setupGlobalInputHandlers() {
    document.addEventListener('mousemove', function(e){
      if (!state.testActive || !state.camera) return;
      if (!isPointerLocked()) return;
      applyLook(e.movementX, e.movementY);
    });

    document.addEventListener('mousedown', function(){
      if (!state.testActive || !state.target || !state.camera) return;
      if (!isPointerLocked()) return;

      state.raycaster.setFromCamera({ x: 0, y: 0 }, state.camera);
      var hits = state.raycaster.intersectObject(state.target);
      var ch = document.getElementById('crosshair-container');

      if (hits.length > 0) {
        state.testHits++;
        var dist = hits[0].distance;
        var wgt = 1 + 0.6 * clamp((dist - 8) / 8, 0, 1);
        state.testWeightedHits += wgt;
        if (ch) ch.classList.remove('miss');
        spawnTarget();
      } else {
        state.testMisses++;
        if (ch) {
          ch.classList.add('miss');
          setTimeout(function(){ ch.classList.remove('miss'); }, 80);
        }
      }
    });

    // Pointer lock change -- if we lose it mid-test, pause
    document.addEventListener('pointerlockchange', function(){
      if (!state.testActive) return;
      if (!isPointerLocked()) {
        pauseTest('Pointer lock terlepas. Klik Resume untuk melanjutkan.');
      }
    });

    // Window blur / visibility -- pause if test running
    window.addEventListener('blur', function(){
      if (state.testActive) pauseTest('Jendela kehilangan fokus. Klik Resume untuk melanjutkan.');
    });
    document.addEventListener('visibilitychange', function(){
      if (document.hidden && state.testActive) {
        pauseTest('Tab tidak aktif. Klik Resume untuk melanjutkan.');
      }
    });

    window.addEventListener('resize', resizeScene);
  }

  /* =========================================================================
   *  CLEANUP + FINISH
   * =======================================================================*/
  function cleanupTest() {
    state.testActive = false;
    if (state.hudTimer)  { clearInterval(state.hudTimer);  state.hudTimer = null; }
    if (state.testTimer) { clearTimeout(state.testTimer); state.testTimer = null; }
    if (state.target && state.scene) { state.scene.remove(state.target); state.target = null; }
    state.trialResolve = null;
    releasePointerLock();
  }

  async function finishPSA() {
    cleanupTest();
    if (state.renderer) {
      cancelAnimationFrame(state.animId);
      state.renderer.domElement.remove();
      state.renderer.dispose();
      state.renderer = null;
    }
    state.screen = 'results';

    var best = null, i;
    for (i = 0; i < state.trials.length; i++) {
      var t = state.trials[i];
      if (t.valid && (!best || t.score > best.score)) best = t;
    }

    if (state.observations.length >= 3) {
      var opt = await requestOptimize();
      opt.sufficient = true;
      state.optimum = opt;
    } else {
      state.optimum = {
        sens: best ? best.sens : state.baseSens,
        dpi:  best ? best.dpi  : state.dpi,
        score: best ? best.score : 0,
        variance: 0, sufficient: false
      };
    }
    renderResults();
  }

  /* =========================================================================
   *  RESULTS
   * =======================================================================*/
  function renderResults() {
    body.classList.remove('no-scroll');
    var game = GAMES[state.game];
    var opt = state.optimum;
    var trials = state.trials;
    var r = state.ranges;
    var optimalSens = opt.sens;
    var optimalDpi = opt.dpi;
    var cms = cm360(optimalSens, optimalDpi, game.yaw);
    var eDpi = optimalSens * optimalDpi;

    var sigma = Math.sqrt(Math.max(0, opt.variance || 0));
    var conf;
    if (!opt.sufficient) conf = 'data belum cukup';
    else if (sigma < 6)  conf = 'tinggi';
    else if (sigma < 12) conf = 'sedang';
    else                 conf = 'rendah';

    var maxScore = 0, i;
    for (i = 0; i < trials.length; i++) if (trials[i].score > maxScore) maxScore = trials[i].score;
    if (maxScore <= 0) maxScore = 1;

    var runningBest = 0;
    var convBars = trials.map(function(t, idx){
      if (t.score > runningBest) runningBest = t.score;
      var sensPct = (r.sensMax - r.sensMin) > 0 ? clamp((t.sens - r.sensMin) / (r.sensMax - r.sensMin), 0, 1) * 100 : 50;
      var fillPct = clamp(runningBest, 0, 100);
      var dim = t.valid ? '' : ';opacity:0.22';
      return '<div class="sf-bar-row">' +
        '<div class="sf-bar-round">T' + (idx + 1) + '</div>' +
        '<div class="sf-bar-track" style="position:relative;">' +
          '<div class="sf-bar-fill" style="position:absolute;left:0%;width:' + fillPct + '%;height:100%' + dim + ';border-radius:3px;"></div>' +
          '<div style="position:absolute;left:' + sensPct + '%;top:-2px;bottom:-2px;width:3px;background:var(--accent-2);transform:translateX(-1.5px);border-radius:2px;box-shadow:0 0 8px var(--accent-2);"></div>' +
        '</div>' +
        '<div style="font-size:10px;color:var(--muted);width:110px;flex-shrink:0;text-align:right;font-family:var(--mono);">' + t.sens.toFixed(4) + ' @ ' + Math.round(t.dpi) + '</div>' +
        '<div style="font-size:10px;color:var(--accent);width:34px;flex-shrink:0;text-align:right;font-family:var(--mono);">' + t.score.toFixed(0) + '</div>' +
      '</div>';
    }).join('');

    var bestScore = 0;
    trials.forEach(function(t){ if (t.valid && t.score > bestScore) bestScore = t.score; });

    var scoreBars = trials.map(function(t, idx){
      var pct = maxScore > 0 ? (t.score / maxScore) * 100 : 0;
      var isBest = (t.valid && t.score === bestScore);
      return '<div class="sf-bar-row">' +
        '<div class="sf-bar-label" style="width:110px;">T' + (idx + 1) + ' ' + t.sens.toFixed(3) + '/' + Math.round(t.dpi) + '</div>' +
        '<div class="sf-bar-track"><div class="sf-bar-fill" style="width:' + pct + '%' + (isBest ? '' : ';opacity:0.6') + (t.valid ? '' : ';background:#3a4048') + '"></div></div>' +
        '<div class="sf-bar-val">' + t.score.toFixed(0) + '</div></div>';
    }).join('');

    var tableRows = trials.map(function(t){
      var mark = t.valid ? '' : ' ✕';
      return '<tr' + (t.valid && t.score === bestScore ? ' class="best"' : '') + (t.valid ? '' : ' class="invalid"') + '>' +
        '<td>' + t.index + mark + '</td>' +
        '<td>' + t.sens.toFixed(4) + '</td>' +
        '<td>' + Math.round(t.dpi) + '</td>' +
        '<td>' + (t.accuracy * 100).toFixed(0) + '%</td>' +
        '<td>' + t.smoothness.toFixed(3) + '</td>' +
        '<td>' + t.deviation.toFixed(3) + '</td>' +
        '<td>' + t.rt.toFixed(0) + '</td>' +
        '<td>' + t.score.toFixed(1) + '</td></tr>';
    }).join('');

    var validCount = state.observations.length;

    body.innerHTML =
      '<div class="sf-container">' +
        '<div class="sf-hero">' +
          '<div class="sf-title">Hasil Optimasi — Selesai</div>' +
          '<div class="sf-sub">Continuous optimizer selesai dalam ' + TOTAL_TRIALS + ' trial. ' + validCount + ' trial lolos filter anomali dan dipakai untuk memetakan permukaan skor f(sens, DPI).</div>' +
        '</div>' +
        '<div class="sf-recommend">' +
          '<div class="sf-label">' + icon('zap', 12) + game.label + ' — Rekomendasi</div>' +
          '<div class="sf-recommend-value">' + optimalSens.toFixed(4) + '</div>' +
          '<div class="sf-recommend-sub">DPI ' + Math.round(optimalDpi) + ' · ' + cms.toFixed(1) + ' cm/360° · ' + eDpi.toFixed(0) + ' eDPI · confidence: ' + conf + '</div>' +
        '</div>' +
        '<div class="sf-card">' +
          '<div class="sf-card-header">' + icon('chart', 16) + '<div class="sf-card-title">Konvergensi Optimizer</div></div>' +
          '<div class="sf-sub" style="font-size:11.5px;">Bar = skor terbaik kumulatif. Garis cyan = posisi sens yang diuji.</div>' +
          '<div class="sf-bars">' + convBars + '</div>' +
        '</div>' +
        '<div class="sf-card">' +
          '<div class="sf-card-header">' + icon('chart', 16) + '<div class="sf-card-title">Skor Semua Trial</div></div>' +
          '<div class="sf-sub" style="font-size:11.5px;">Score = 0.40·Acc + 0.30·Smooth − 0.20·Dev − 0.10·RT. Tertinggi: ' + bestScore.toFixed(1) + '.</div>' +
          '<div class="sf-bars">' + scoreBars + '</div>' +
        '</div>' +
        '<div class="sf-card">' +
          '<div class="sf-card-header">' + icon('grid', 16) + '<div class="sf-card-title">Data Mentah</div></div>' +
          '<div style="overflow-x:auto;">' +
            '<table class="sf-table"><thead><tr><th>#</th><th>Sens</th><th>DPI</th><th>Acc</th><th>Smooth</th><th>Dev</th><th>RT</th><th>Skor</th></tr></thead><tbody>' + tableRows + '</tbody></table>' +
          '</div>' +
        '</div>' +
        '<div class="' + (opt.sufficient ? 'sf-info' : 'sf-warn') + '">' +
          icon(opt.sufficient ? 'info' : 'alert', 16) +
          '<div>' +
            (opt.sufficient
              ? 'Catatan: kecepatan putar kamera FPS hanya bergantung pada eDPI (sens × DPI). Optimizer memilih titik pada ridge eDPI konstan yang DPI-nya paling dekat dengan DPI kamu (tie-break &lt; ' + RIDGE_TOL + ' poin).'
              : '<strong>Data belum cukup untuk rekomendasi solid.</strong> Hanya ' + validCount + ' trial yang lolos filter anomali dari ' + TOTAL_TRIALS + '. Ulangi tes.') +
          '</div>' +
        '</div>' +
        '<div class="sf-btn-row" style="justify-content:flex-end;">' +
          '<button class="sf-btn ghost" id="sf-restart-btn">' + icon('refresh', 14) + 'Ulangi dari awal</button>' +
          '<button class="sf-btn" id="sf-copy-btn">' + icon('copy', 14) + 'Salin ' + optimalSens.toFixed(4) + ' @ ' + Math.round(optimalDpi) + ' DPI</button>' +
        '</div>' +
        '<div class="sf-disclaimer">Tool ini memberi estimasi awal berdasarkan hasil aim-test di browser. Gunakan sebagai titik awal, sesuaikan manual di game.</div>' +
      '</div>';

    document.getElementById('sf-copy-btn').addEventListener('click', function(){
      var txt = optimalSens.toFixed(4) + ' @ ' + Math.round(optimalDpi) + ' DPI';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function(){
          var btn = document.getElementById('sf-copy-btn');
          var orig = btn.innerHTML;
          btn.innerHTML = icon('check', 14) + 'Tersalin';
          setTimeout(function(){ btn.innerHTML = orig; }, 1400);
        }).catch(function(){});
      }
    });

    document.getElementById('sf-restart-btn').addEventListener('click', returnToSetup);
  }

  /* =========================================================================
   *  BOOT
   * =======================================================================*/
  function init() {
    state.worker = createWorker();
    brandIcon.innerHTML = icon('target', 16);
    setupGlobalInputHandlers();
    root.hidden = false;
    loader.classList.add('loading-hidden');
    loader.classList.add('hidden');
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
