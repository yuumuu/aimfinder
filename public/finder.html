<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sens Finder 3D — Continuous AI Sensitivity Optimizer</title>
<meta name="theme-color" content="#0a0d11">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230a0d11'/><circle cx='16' cy='16' r='8' fill='none' stroke='%23e8a33d' stroke-width='2'/><circle cx='16' cy='16' r='2' fill='%23e8a33d'/></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0d11; }

  :root {
    --bg: #0a0d11; --bg-2: #0d1116;
    --panel: #12161c; --panel-2: #171c24; --panel-3: #1c222b;
    --line: #232a34; --line-2: #2c3441;
    --text: #e6e9ee; --text-2: #b8c0cc;
    --muted: #7c8797; --muted-2: #5a6473;
    --accent: #e8a33d; --accent-2: #45d6c4; --accent-3: #6ba6ff;
    --danger: #ff5d5d; --success: #4ade80;
    --mono: 'JetBrains Mono', 'Consolas', 'SFMono-Regular', 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    --radius-sm: 6px; --radius: 10px; --radius-lg: 14px;
  }

  #sf-loader { position: fixed; inset: 0; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #0a0d11; color: #e6e9ee; font-family: var(--mono); transition: opacity .4s, visibility .4s; }
  #sf-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #sf-loader .spinner { width: 36px; height: 36px; border: 2px solid #232a34; border-top-color: #e8a33d; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #sf-loader .brand { font-weight: 700; letter-spacing: 3px; font-size: 14px; color: #e8a33d; }
  #sf-loader .status { font-size: 12px; color: #7c8797; }

  #sf-root { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; background: var(--bg); color: var(--text); font-family: var(--sans); display: flex; flex-direction: column; overflow: hidden; }
  #sf-root * { box-sizing: border-box; }

  .sf-header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, var(--bg-2), var(--bg)); z-index: 20; }
  .sf-brand { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-weight: 700; letter-spacing: 2px; font-size: 13px; color: var(--accent); text-transform: uppercase; }
  .sf-brand .brand-mark { width: 26px; height: 26px; border-radius: 6px; background: rgba(232, 163, 61, 0.1); border: 1px solid rgba(232, 163, 61, 0.3); display: flex; align-items: center; justify-content: center; color: var(--accent); }
  .sf-brand .brand-sub { color: var(--muted); font-weight: 400; margin-left: 2px; }
  .sf-header-actions { display: flex; align-items: center; gap: 8px; }
  .sf-icon-btn { width: 34px; height: 34px; border-radius: 8px; background: transparent; border: 1px solid var(--line); color: var(--text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .sf-icon-btn:hover { background: var(--panel-2); border-color: var(--line-2); color: var(--text); }
  .sf-icon-btn:active { transform: scale(.95); }

  .sf-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 24px; display: flex; flex-direction: column; }
  .sf-body.no-scroll { overflow: hidden; padding: 0; }
  .sf-body::-webkit-scrollbar { width: 10px; }
  .sf-body::-webkit-scrollbar-track { background: transparent; }
  .sf-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  .sf-container { max-width: 1180px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .sf-title { font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .sf-sub { color: var(--text-2); font-size: 13px; line-height: 1.6; }
  .sf-sub strong { color: var(--text); font-weight: 600; }
  .sf-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-family: var(--mono); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .sf-label .sf-icon { color: var(--muted); }
  .kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; font-family: var(--mono); font-size: 10.5px; font-weight: 700; background: var(--panel-3); color: var(--text); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; }

  .sf-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .sf-card-header { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .sf-card-header .sf-icon { color: var(--accent); }
  .sf-card-title { font-size: 13.5px; font-weight: 600; letter-spacing: .3px; }
  .sf-card-sub { font-size: 11.5px; color: var(--muted); margin-left: auto; font-family: var(--mono); }
  .sf-hero { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
  .sf-hero .sf-title { font-size: 24px; }

  .sf-field { display: flex; flex-direction: column; gap: 6px; }
  .sf-input, .sf-textarea { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); padding: 9px 11px; border-radius: var(--radius-sm); font-family: var(--mono); font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s; width: 100%; }
  .sf-input:focus, .sf-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232, 163, 61, 0.12); }
  .sf-textarea { resize: vertical; min-height: 56px; font-size: 12px; line-height: 1.5; }
  .sf-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sf-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  .sf-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: #1a1305; border: none; padding: 10px 18px; border-radius: var(--radius-sm); font-weight: 700; font-size: 13px; cursor: pointer; letter-spacing: .2px; font-family: var(--sans); transition: transform .1s, filter .15s, box-shadow .15s; white-space: nowrap; }
  .sf-btn:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 4px 14px rgba(232, 163, 61, 0.25); }
  .sf-btn:active:not(:disabled) { transform: scale(.98); }
  .sf-btn:disabled { opacity: .35; cursor: not-allowed; }
  .sf-btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--line-2); }
  .sf-btn.secondary:hover:not(:disabled) { background: var(--panel-2); box-shadow: none; }
  .sf-btn.ghost { background: transparent; color: var(--text-2); border: 1px solid var(--line); }
  .sf-btn.ghost:hover:not(:disabled) { background: var(--panel-2); color: var(--text); box-shadow: none; }
  .sf-btn.danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,93,93,0.3); }
  .sf-btn.danger:hover:not(:disabled) { background: rgba(255,93,93,0.08); box-shadow: none; }
  .sf-btn.sm { padding: 7px 12px; font-size: 11.5px; }
  .sf-btn.large { padding: 13px 24px; font-size: 14px; border-radius: var(--radius); }
  .sf-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .sf-error { color: var(--danger); font-size: 12px; min-height: 16px; }

  .sf-radio-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .sf-radio { border: 1px solid var(--line); background: var(--panel-2); padding: 10px 12px; border-radius: var(--radius); cursor: pointer; flex: 1; min-width: 110px; transition: all .15s; text-align: center; user-select: none; }
  .sf-radio:hover { border-color: var(--line-2); background: var(--panel-3); }
  .sf-radio.selected { border-color: var(--accent); background: rgba(232, 163, 61, 0.08); box-shadow: 0 0 0 3px rgba(232, 163, 61, 0.1); }
  .sf-radio-title { font-weight: 700; font-size: 12.5px; margin-bottom: 2px; }
  .sf-radio-desc { font-size: 10.5px; color: var(--muted); font-family: var(--mono); }

  .sf-tabs { display: flex; gap: 4px; padding: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .sf-tab { flex: 1; padding: 7px 10px; border-radius: 5px; background: transparent; border: none; color: var(--muted); font-size: 11.5px; font-family: var(--mono); font-weight: 600; letter-spacing: .5px; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .sf-tab:hover { color: var(--text-2); }
  .sf-tab.active { background: var(--panel); color: var(--accent); }

  .sf-crosshair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .sf-crosshair-preview { background: radial-gradient(ellipse at center, #1a1f28 0%, #0a0d11 100%); border: 1px solid var(--line); border-radius: var(--radius); min-height: 160px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .sf-crosshair-preview::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px); background-size: 20px 20px; pointer-events: none; }
  .sf-crosshair-preview > svg { position: relative; z-index: 1; }

  .sf-slider-row { display: flex; align-items: center; gap: 10px; }
  .sf-slider-label { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 82px; flex-shrink: 0; }
  .sf-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; background: var(--panel-3); border-radius: 2px; outline: none; cursor: pointer; }
  .sf-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--accent); }
  .sf-slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--bg); }
  .sf-slider-val { font-family: var(--mono); font-size: 11px; color: var(--text-2); width: 38px; text-align: right; flex-shrink: 0; }

  .sf-toggle-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sf-toggle { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: var(--radius-sm); background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); font-size: 12px; cursor: pointer; transition: all .15s; user-select: none; }
  .sf-toggle:hover { border-color: var(--line-2); color: var(--text-2); }
  .sf-toggle.active { background: rgba(232, 163, 61, 0.1); border-color: var(--accent); color: var(--accent); }
  .sf-toggle-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-2); transition: background .15s; }
  .sf-toggle.active .sf-toggle-dot { background: var(--accent); }

  .sf-color-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .sf-color-swatch { width: 24px; height: 24px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; transition: all .15s; }
  .sf-color-swatch:hover { transform: scale(1.08); }
  .sf-color-swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--text); }

  .sf-info { background: rgba(107, 166, 255, 0.06); border: 1px solid rgba(107, 166, 255, 0.25); border-radius: var(--radius); padding: 10px 12px; font-size: 12px; line-height: 1.55; color: var(--text-2); display: flex; gap: 10px; align-items: flex-start; }
  .sf-info .sf-icon { color: var(--accent-3); flex-shrink: 0; margin-top: 1px; }
  .sf-warn { border: 1px solid #6b5420; background: rgba(232, 163, 61, 0.06); padding: 10px 12px; border-radius: var(--radius); font-size: 12px; color: var(--accent); line-height: 1.55; display: flex; gap: 10px; align-items: flex-start; }

  .sf-shortcuts { display: flex; gap: 14px; flex-wrap: wrap; }
  .sf-shortcut { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); }

  .sf-details { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .sf-details > summary { cursor: pointer; padding: 10px 14px; background: var(--panel-2); font-size: 12.5px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 8px; list-style: none; user-select: none; }
  .sf-details > summary::-webkit-details-marker { display: none; }
  .sf-details > summary::before { content: '▸'; color: var(--muted); transition: transform .2s; display: inline-block; }
  .sf-details[open] > summary::before { transform: rotate(90deg); }
  .sf-details > summary:hover { background: var(--panel-3); color: var(--text); }
  .sf-details-body { padding: 14px; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }

  /* ============ SESSION HISTORY ============ */
  .sf-history-chart { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; overflow: hidden; }
  .sf-history-chart svg { display: block; width: 100%; height: auto; }

  /* ============ HEATMAP ============ */
  .sf-heatmap-wrap { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }
  .sf-heatmap-svg { background: radial-gradient(ellipse at center, #1a1f28 0%, #0a0d11 100%); border: 1px solid var(--line); border-radius: var(--radius); }
  .sf-heatmap-legend { font-size: 12px; color: var(--text-2); display: flex; flex-direction: column; gap: 8px; }
  .sf-heatmap-legend .legend-row { display: flex; align-items: center; gap: 8px; }
  .sf-heatmap-legend .dot { width: 10px; height: 10px; border-radius: 50%; }

  /* ============ MODAL ============ */
  .sf-modal-bg { position: fixed; inset: 0; z-index: 100; background: rgba(5, 7, 10, 0.85); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .sf-modal { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); max-width: 520px; width: 100%; padding: 22px; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto; }
  .sf-modal-title { font-size: 18px; font-weight: 700; }
  .sf-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .sf-test-screen { position: absolute; inset: 0; overflow: hidden; background: #05070a; }
  #scene-wrap { position: absolute; inset: 0; overflow: hidden; background: #05070a; display: flex; align-items: center; justify-content: center; z-index: 0; }
  #scene-wrap canvas { display: block; width: 100% !important; height: 100% !important; }

  #crosshair-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; display: flex; align-items: center; justify-content: center; }
  #crosshair-container.miss > svg rect, #crosshair-container.miss > svg circle { fill: var(--danger) !important; }

  .sf-hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 22px; z-index: 5; pointer-events: none; font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  .sf-hud .hud-item { display: flex; flex-direction: column; gap: 3px; }
  .sf-hud .hud-label { font-size: 9.5px; letter-spacing: 1.5px; color: var(--muted-2); text-transform: uppercase; }
  .sf-hud .hud-value { font-size: 15px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .sf-hud .hud-value.accent { color: var(--accent); }
  .sf-hud .hud-center { text-align: center; }
  .sf-hud .hud-right { text-align: right; align-items: flex-end; }

  .sf-hud-mute { position: absolute; bottom: 20px; right: 20px; z-index: 7; width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s; }
  .sf-hud-mute:hover { background: rgba(255,255,255,0.1); color: var(--text); }
  .sf-hud-mute.muted { color: var(--muted-2); }

  #realtime-graph { position: absolute; bottom: 20px; left: 20px; z-index: 7; width: 220px; height: 70px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; display: none; }
  #realtime-graph.on { display: block; }

  .sf-timer-bar { position: absolute; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 6; transition: width .1s linear; box-shadow: 0 0 12px rgba(232, 163, 61, 0.6); }
  .sf-timer-big { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 60px; font-weight: 700; color: rgba(230, 233, 238, 0.10); letter-spacing: -3px; z-index: 4; pointer-events: none; font-variant-numeric: tabular-nums; }
  .sf-timer-big.warning { color: rgba(255, 93, 93, 0.25); }

  .sf-countdown-big { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: var(--mono); font-size: 160px; font-weight: 800; color: var(--accent); z-index: 12; pointer-events: none; text-shadow: 0 0 40px rgba(232, 163, 61, 0.5); opacity: 0; }
  .sf-countdown-big.show { animation: cd-pop .7s cubic-bezier(.2, .8, .3, 1); }
  @keyframes cd-pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 40% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); } }

  #test-overlay { position: absolute; inset: 0; z-index: 15; background: rgba(5, 7, 10, 0.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 40px 32px; overflow-y: auto; }
  #test-overlay.hidden { display: none; }
  .overlay-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 20px; background: rgba(232, 163, 61, 0.1); border: 1px solid rgba(232, 163, 61, 0.3); color: var(--accent); font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.5px; font-weight: 600; text-transform: uppercase; }
  .overlay-badge.success { background: rgba(74, 222, 128, 0.1); border-color: rgba(74, 222, 128, 0.3); color: var(--success); }
  .overlay-badge.danger { background: rgba(255, 93, 93, 0.1); border-color: rgba(255, 93, 93, 0.3); color: var(--danger); }
  .overlay-title { font-size: 26px; font-weight: 700; letter-spacing: -.01em; max-width: 560px; line-height: 1.25; }
  .overlay-desc { color: var(--text-2); font-size: 13.5px; max-width: 520px; line-height: 1.6; }
  .overlay-stats { display: flex; gap: 24px; margin: 4px 0; padding: 12px 22px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--line); border-radius: var(--radius); }
  .overlay-stat { display: flex; flex-direction: column; gap: 3px; align-items: center; }
  .overlay-stat-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 1.5px; color: var(--muted-2); text-transform: uppercase; }
  .overlay-stat-value { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .overlay-stat-value.accent { color: var(--accent); }
  .overlay-hint { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 12.5px; padding: 8px 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .overlay-countdown-inline { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 2px; }
  .overlay-countdown-inline b { color: var(--accent); font-weight: 700; }

  .pause-actions { display: flex; flex-direction: column; gap: 7px; width: 100%; max-width: 340px; margin-top: 6px; text-align: left; }
  .pause-actions .sf-btn { justify-content: flex-start; padding: 11px 18px; width: 100%; text-align: left; }
  .pause-error { color: var(--danger); font-size: 12px; min-height: 16px; font-family: var(--mono); margin-top: 4px; }
  .pause-crosshair { display: grid; grid-template-columns: 180px 1fr; gap: 18px; width: 100%; max-width: 620px; padding: 14px; background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: var(--radius); text-align: left; }
  .pause-ch-preview { background: radial-gradient(ellipse at center, #1a1f28 0%, #0a0d11 100%); border: 1px solid var(--line); border-radius: var(--radius-sm); min-height: 150px; display: flex; align-items: center; justify-content: center; }
  .pause-ch-controls { display: flex; flex-direction: column; gap: 9px; }

  .sf-recommend { border: 1px solid var(--accent); background: linear-gradient(135deg, rgba(232, 163, 61, 0.08), rgba(232, 163, 61, 0.02)); border-radius: var(--radius-lg); padding: 20px 22px; }
  .sf-recommend .sf-label { color: var(--accent); margin-bottom: 4px; }
  .sf-recommend-value { font-family: var(--mono); font-size: 36px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 4px; color: var(--text); }
  .sf-recommend-sub { font-size: 12.5px; color: var(--text-2); font-family: var(--mono); }

  .sf-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
  .sf-table th, .sf-table td { padding: 8px 9px; border-bottom: 1px solid var(--line); text-align: left; }
  .sf-table th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: .8px; background: var(--panel-2); position: sticky; top: 0; }

    var ru = kRegress(obs, best.sens, best.dpi, ss, sd);
    best.variance = ru.variance; best.weight = ru.weight;
    return best;
  }
  function kAcquire(obs, ranges, ss, sd, kappa) {
    var rS = ranges.sensMax - ranges.sensMin;
    var rD = ranges.dpiMax - ranges.dpiMin;
    if (!obs || obs.length === 0) return { sens: ranges.sensMin + Math.random() * rS, dpi: ranges.dpiMin + Math.random() * rD };
    var best = null, bestU = -Infinity;
    for (var i = 0; i < 800; i++) {
      var s = ranges.sensMin + Math.random() * rS;
      var d = ranges.dpiMin + Math.random() * rD;
      var reg = kRegress(obs, s, d, ss, sd);
      var dmin = Infinity;
      for (var j = 0; j < obs.length; j++) {
        var a = (s - obs[j].sens) / rS, b = (d - obs[j].dpi) / rD;
        var q = a * a + b * b;
        if (q < dmin) dmin = q;
      }
      dmin = Math.sqrt(dmin);
      var u = reg.mean + kappa * dmin;
      if (u > bestU) { bestU = u; best = { sens: s, dpi: d }; }
    }
    return best;
  }

    var game = GAMES[state.game];
    var baseDpi = state.baseDpi || state.dpi;

    var sens = state.testSens;
    var k = trialDpi / baseDpi;
    var perCountRad = sens * game.yaw * (Math.PI / 180);
    state.yaw   -= movementX * k * perCountRad;
    state.pitch -= movementY * k * perCountRad;

    _qYaw.setFromAxisAngle(AXIS_Y, state.yaw);

  function renderHistoryCard() {
    var recent = sessionHistory.slice(-10);
    var maxE = 1, minE = Infinity;
    recent.forEach(function(h) { if (h.edpi > maxE) maxE = h.edpi; if (h.edpi < minE) minE = h.edpi; });
    if (minE === Infinity) minE = 0;
    var range = Math.max(1, maxE - minE);

    var W = 800, H = 100, PAD = 30;
    var stepX = recent.length > 1 ? (W - PAD*2) / (recent.length - 1) : 0;
    var points = recent.map(function(h, i) {
      var x = PAD + i * stepX;
      var y = H - PAD - ((h.edpi - minE) / range) * (H - PAD*2);
      return x + ',' + y;
    });
    var pathStr = 'M' + points.join(' L');
    var dots = recent.map(function(h, i) {
      var x = PAD + i * stepX;
      var y = H - PAD - ((h.edpi - minE) / range) * (H - PAD*2);
      return '<circle cx="' + x + '" cy="' + y + '" r="4" fill="#45d6c4" stroke="#0a0d11" stroke-width="1.5"/>';
    }).join('');
    var labels = recent.map(function(h, i) {
      if (i % 2 !== 0 && i !== recent.length - 1) return '';
      var x = PAD + i * stepX;
      return '<text x="' + x + '" y="' + (H - 6) + '" text-anchor="middle" fill="#7c8797" font-size="9" font-family="monospace">T' + (sessionHistory.length - recent.length + i + 1) + '</text>';
    }).join('');

    return '<div class="sf-card">' +
      '<div class="sf-card-header">' + icon('chart', 16) + '<div class="sf-card-title">Session History</div>' +
        '<div class="sf-card-sub">' + sessionHistory.length + ' sessions</div></div>' +
      '<div class="sf-sub" style="font-size:11.5px;">eDPI optimal dari ' + recent.length + ' sesi terakhir. Rentang ' + Math.round(minE) + ' – ' + Math.round(maxE) + '.</div>' +
      '<div class="sf-history-chart">' +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
          '<path d="' + pathStr + '" fill="none" stroke="#e8a33d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
          dots + labels +
        '</svg>' +
      '</div>' +
      '<div class="sf-btn-row" style="justify-content:flex-end;">' +
        '<button class="sf-btn ghost sm" id="btn-clear-history">' + icon('trash', 13) + 'Clear History</button>' +
      '</div>' +
    '</div>';
  }

  function exportAllJSON() {
    var data = {
      version: 2,
      ts: Date.now(),
      profiles: profiles,
      history: sessionHistory
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'sens-finder-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importAllJSON() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json,.json';
    inp.onchange = function() {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var data = JSON.parse(e.target.result);
          if (data && data.profiles && data.profiles.games) {
            profiles = data.profiles;
            saveProfiles();
            sessionHistory = Array.isArray(data.history) ? data.history : [];
            STORAGE.save('history', sessionHistory);
            applyProfileToState();
            renderSetup();
          } else {
            alert('Format file tidak dikenal.');
          }
        } catch (err) { alert('Gagal membaca JSON: ' + err.message); }
      };
      reader.readAsText(f);
    };
    inp.click();
  }

  function openDPICalibrator() {
    var bg = document.createElement('div');
    bg.className = 'sf-modal-bg';
    bg.innerHTML =
      '<div class="sf-modal">' +
        '<div class="sf-modal-title">' + icon('ruler', 18) + ' Hardware DPI Calibrator</div>' +
        '<div class="sf-sub" style="font-size:12.5px;">' +
          '1. Letakkan mouse di ujung penggaris, tandai titik start.<br>' +
          '2. Klik <b>Start</b>, gerakkan mouse <em>lurus</em> sejauh jarak yang ditentukan.<br>' +
          '3. Klik <b>Stop</b> saat mencapai titik akhir.<br>' +
          '4. Tool menghitung DPI dari raw counts Chrome.' +
        '</div>' +
        '<div class="sf-info" style="font-size:11.5px;">' + icon('info', 14) + 'Pastikan Windows pointer speed = 6/11 dan Enhance pointer precision OFF, jika tidak hasil tidak akurat.</div>' +
        '<div class="sf-field">' +
          '<label class="sf-label">Distance (cm)</label>' +
          '<input class="sf-input" id="dpi-dist" type="number" min="2" max="50" step="0.5" value="' + state.dpiCalDistanceCm + '" />' +
        '</div>' +
        '<div class="sf-field">' +
          '<label class="sf-label">Counts moved</label>' +
          '<input class="sf-input" id="dpi-counts" type="text" value="0" readonly />' +
        '</div>' +
        '<div class="sf-field">' +
          '<label class="sf-label">Calculated DPI</label>' +
          '<input class="sf-input" id="dpi-result" type="text" value="—" readonly />' +
        '</div>' +
        '<div class="sf-modal-actions">' +
          '<button class="sf-btn secondary" id="dpi-cancel">Cancel</button>' +
          '<button class="sf-btn" id="dpi-start">Start</button>' +
          '<button class="sf-btn" id="dpi-apply" disabled>Apply DPI</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(bg);

    var countsEl = bg.querySelector('#dpi-counts');
    var resultEl = bg.querySelector('#dpi-result');
    var distEl   = bg.querySelector('#dpi-dist');
    var startBtn = bg.querySelector('#dpi-start');
    var applyBtn = bg.querySelector('#dpi-apply');
    var cancelBtn = bg.querySelector('#dpi-cancel');

    var active = false;
    var counts = 0;
    var lastX = null;

    function onMove(e) {
      if (!active) return;
      // movementX can be large; accumulate absolute X to be robust.
      if (lastX === null) { lastX = e.movementX; return; }
      counts += Math.abs(e.movementX);
      countsEl.value = counts;
      lastX = e.movementX;
    }
    document.addEventListener('mousemove', onMove);

    function close() {
      active = false;
      document.removeEventListener('mousemove', onMove);
      document.body.removeChild(bg);
    }

    startBtn.addEventListener('click', function() {
      if (!active) {
        active = true;
        counts = 0;
        lastX = null;
        countsEl.value = '0';
        resultEl.value = '—';
        applyBtn.disabled = true;
        startBtn.textContent = 'Stop';
      } else {
        active = false;
        startBtn.textContent = 'Start';
        var distCm = parseFloat(distEl.value) || 10;
        if (counts > 0 && distCm > 0) {
          var inches = distCm / 2.54;
          var dpi = Math.round(counts / inches);
          resultEl.value = dpi + ' DPI';
          applyBtn.disabled = false;
          applyBtn.onclick = function() {
            state.dpi = dpi;
            document.getElementById('sf-dpi').value = dpi;
            saveCurrentToProfile();
            close();
          };
        }
      }
    });
    cancelBtn.addEventListener('click', close);
  }

  function initRealtimeGraph() {
    var c = document.getElementById('realtime-graph');
    if (!c) return;
    // Handle DPR for sharp lines without CSS scaling.
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = c.clientWidth || 220, h = c.clientHeight || 70;
    c.width = Math.floor(w * dpr);
    c.height = Math.floor(h * dpr);
    state.graphCanvas = c;
    state.graphCtx = c.getContext('2d');
    if (state.graphCtx) state.graphCtx.scale(dpr, dpr);
    state.graphIdx = 0;
    for (var i = 0; i < state.graphOmega.length; i++) state.graphOmega[i] = 0;
    for (var j = 0; j < state.graphDist.length; j++) state.graphDist[j] = 0;
  }

  function drawRealtimeGraph() {
    var c = state.graphCanvas;
    var ctx = state.graphCtx;
    if (!c || !ctx) return;
    var w = c.clientWidth, h = c.clientHeight;
    ctx.clearRect(0, 0, w, h);
    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, h/2); ctx.lineTo(w, h/2);
    ctx.stroke();
    // Omega line (top half)
    var N = state.graphOmega.length;
    var maxOmega = 1;
    for (var i = 0; i < N; i++) if (state.graphOmega[i] > maxOmega) maxOmega = state.graphOmega[i];
    ctx.strokeStyle = '#45d6c4';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var i = 0; i < N; i++) {
      var x = (i / (N - 1)) * w;
      var y = (h/2) - (state.graphOmega[i] / maxOmega) * (h/2 - 2);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // Distance line (bottom half)
    var maxD = 1;
    for (var i = 0; i < N; i++) if (state.graphDist[i] > maxD) maxD = state.graphDist[i];
    ctx.strokeStyle = '#e8a33d';
    ctx.beginPath();
    for (var i = 0; i < N; i++) {
      var x = (i / (N - 1)) * w;
      var y = h - (state.graphDist[i] / maxD) * (h/2 - 2);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    // Labels
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '9px monospace';
    ctx.fillText('ω', 4, 12);
    ctx.fillText('dist', 4, h - 4);
  }

  /* =========================================================================
   *  MAIN LOOP
   * =======================================================================*/
  function taskSequence() {
    if (state.taskMix === 'flick') return 'flick';
    if (state.taskMix === 'micro') return 'micro';
    if (state.taskMix === 'tracking') return 'tracking';
    // mixed: alternate
    var seq = ['flick', 'micro', 'tracking'];
    return seq[Math.floor(Math.random() * seq.length)];
  }

  async function runOptimizer() {
    /* Warm-up: 1 unscored trial */
    if (state.warmupEnabled) {
      var wp = { sens: state.baseSens, dpi: state.dpi, warmup: true, taskType: 'flick' };
      await showTrialIntro(0, wp);
      await sleep(80);
      if (!isPointerLocked()) {
        var wa = await showPauseMenu('Pointer lock gagal. Resume untuk coba lagi.');
        if (wa === 'exit' || wa === 'restart_session') { returnToSetup(); return; }
      } else {
        await showActiveCountdown();
        await runSingleTest(wp, 0);
        releasePointerLock();
      }
    }

    for (var i = 0; i < TOTAL_TRIALS; i++) {
      var pt = await pickPoint(i);
      pt.taskType = taskSequence();
      var outerContinue = false;

      while (!outerContinue) {
        await showTrialIntro(i + 1, pt);
        await sleep(80);
        if (!isPointerLocked()) {
          var action = await showPauseMenu('Pointer lock gagal aktif. Klik Resume untuk coba lagi.');
          if (action === 'restart_trial') continue;
          if (action === 'restart_session') { returnToSetup(); return; }
          if (action === 'exit')            { returnToSetup(); return; }
          continue;
        }
        await showActiveCountdown();
        if (!isPointerLocked()) {
          var action2 = await showPauseMenu('Pointer lock terlepas sebelum tes dimulai.');
          if (action2 === 'restart_trial') continue;
          if (action2 === 'restart_session') { returnToSetup(); return; }
          if (action2 === 'exit')            { returnToSetup(); return; }
          continue;
        }
        var result = await runSingleTest(pt, i + 1);
        if (result === 'paused') {
          var action3 = await showPauseMenu(state.pauseReason);
          if (action3 === 'resume')          continue;
          if (action3 === 'restart_trial')   continue;
          if (action3 === 'restart_session') { returnToSetup(); return; }
          if (action3 === 'exit')            { returnToSetup(); return; }
          continue;
        }

        registerTrial(result);
        releasePointerLock();
        AudioSys.complete();

        // AFK / rage-quit detection
        if (result.valid && result.score < 8) {
          state.consecutiveBad++;
        } else if (!result.valid) {
          state.consecutiveBad++;
        } else {
          state.consecutiveBad = 0;
        }

        await showTrialComplete(i + 1, result);

        if (state.consecutiveBad >= AFK_THRESH) {
          var afk = await showAFKDialog();
          if (afk === 'abort') { finishPSA(); return; }
          state.consecutiveBad = 0;
        }
        outerContinue = true;
      }
    }
    finishPSA();
  }

  function returnToSetup() {
    cleanupTest();
    if (state.renderer) {
      cancelAnimationFrame(state.animId);
      state.renderer.domElement.remove();
      state.renderer.dispose();
      state.renderer = null;
    }
    state.trials = []; state.observations = []; state.optimum = null;
    state.missData = [];
    state.screen = 'setup';
    render();
  }

  async function pickPoint(i) {
    var r = state.ranges;
    if (i === 0) return { sens: clamp(state.baseSens, r.sensMin, r.sensMax), dpi: clamp(state.dpi, r.dpiMin, r.dpiMax) };
    if (i <= EXPLORE_TRIALS) {
      if (i % 2 === 1 || state.observations.length === 0) return { sens: rand(r.sensMin, r.sensMax), dpi: rand(r.dpiMin, r.dpiMax) };
      var best = state.observations.reduce(function(a, b){ return b.score > a.score ? b : a; });
      var js = (r.sensMax - r.sensMin) * 0.16;
      var jd = (r.dpiMax  - r.dpiMin)  * 0.16;
      return { sens: clamp(gauss(best.sens, js), r.sensMin, r.sensMax), dpi: clamp(gauss(best.dpi, jd), r.dpiMin, r.dpiMax) };
    }
    return await requestSuggest();
  }

  function registerTrial(t) {
    state.trials.push(t);
    if (t.valid) state.observations.push({ sens: t.sens, dpi: t.dpi, score: t.score });
  }

  /* =========================================================================
   *  TRIAL RUNNER
   * =======================================================================*/
  function runSingleTest(pt, round) {
    return new Promise(function(resolve){
      if (!isPointerLocked()) { resolve('paused'); state.pauseReason = 'Pointer lock tidak aktif.'; return; }
      resetTelemetry();
      state.testActive = true;
      state.testHits = 0; state.testMisses = 0; state.testWeightedHits = 0;
      state.testRt = [];
      state.testStartTime = performance.now();
      state.targetSpawnTime = 0;
      state.targetReacted = false;
      state.testSens = pt.sens;
      state.testDpi  = pt.dpi;
      state.yaw = 0; state.pitch = 0;
      state.hudTimer = null; state.testTimer = null;
      state.trialResolve = resolve;
      state.currentTaskType = pt.taskType || 'flick';
      state.isWarmup = !!pt.warmup;
      state.trackOnTarget = 0;
      state.trackTotal = 0;
      state.missData = [];
      if (state.camera) state.camera.quaternion.set(0, 0, 0, 1);

      var hudHits  = document.getElementById('hud-hits');
      var hudTime  = document.getElementById('hud-time');
      var hudSens  = document.getElementById('hud-sens');
      var hudRound = document.getElementById('hud-round');
      var hudTask  = document.getElementById('hud-task-label');
      var timerBar = document.getElementById('timer-bar');
      var timerBig = document.getElementById('timer-big');
      if (hudRound) hudRound.textContent = state.isWarmup ? 'W' : round;
      if (hudSens)  hudSens.textContent  = pt.sens.toFixed(4) + ' @ ' + Math.round(pt.dpi);
      if (hudTask)  hudTask.textContent  = TASK_MODES[state.currentTaskType].label;

      spawnTarget();

      var dur = state.isWarmup ? WARMUP_DURATION : TEST_DURATION;

      state.hudTimer = setInterval(function(){
        if (!state.testActive) return;
        var elapsed = performance.now() - state.testStartTime;
        var remaining = Math.max(0, (dur - elapsed) / 1000);
        var pct = clamp(elapsed / dur, 0, 1) * 100;
        if (hudHits) hudHits.textContent = state.testHits;
        if (hudTime) hudTime.textContent = Math.ceil(remaining);
        if (timerBar) timerBar.style.width = pct + '%';
        if (timerBig) {
          timerBig.textContent = Math.ceil(remaining);
          timerBig.classList.toggle('warning', remaining < 4);
        }
      }, 80);

      state.testTimer = setTimeout(function(){
        if (!state.testActive) return;
        state.testActive = false;
        if (state.hudTimer) { clearInterval(state.hudTimer); state.hudTimer = null; }
        if (state.target) { state.scene.remove(state.target); state.target = null; }
        state.trialResolve = null;
        resolve(computeTrialResult(pt, round));
      }, dur);
    });
  }

  function pauseTest(reason) {
    if (!state.testActive) return;
    state.testActive = false;
    state.pauseReason = reason;
    if (state.hudTimer) { clearInterval(state.hudTimer); state.hudTimer = null; }
    if (state.testTimer) { clearTimeout(state.testTimer); state.testTimer = null; }
    if (state.target) { state.scene.remove(state.target); state.target = null; }
    releasePointerLock();
    if (state.trialResolve) {
      var r = state.trialResolve;
      state.trialResolve = null;
      r('paused');
    }
  }

  /* =========================================================================
   *  METRICS
   * =======================================================================*/
  function computeTrialResult(pt, round) {
    var n = telemetry.n, i;
    var sum = 0, sum2 = 0, cnt = 0;
    for (i = 0; i < n; i++) {
      if (telemetry.w[i] < 0.2) continue;
      var a = telemetry.a[i];
      if (!isFinite(a)) continue;
      sum += a; sum2 += a * a; cnt++;
    }
    var meanA = cnt ? sum / cnt : 0;
    var varA  = cnt > 1 ? Math.max(0, sum2 / cnt - meanA * meanA) : 0;
    var sdA   = Math.sqrt(varA);
    var smoothness = 1 / (1 + sdA / SMOOTH_REF);

    var dsum = 0, dcnt = 0, depthSum = 0;
    for (i = 0; i < n; i++) {
      if (telemetry.dist[i] <= 0) continue;
      dsum += telemetry.dev[i]; depthSum += telemetry.dist[i]; dcnt++;
    }
    var devRad = dcnt ? dsum / dcnt : DEV_REF;
    var deviation = clamp(devRad / DEV_REF, 0, 1);
    var meanDepth = dcnt ? depthSum / dcnt : 0;

    var accuracy;
    if (state.currentTaskType === 'tracking') {
      accuracy = state.trackTotal > 0 ? (state.trackOnTarget / state.trackTotal) : 0;
    } else {
      accuracy = (state.testWeightedHits + state.testMisses) > 0
        ? state.testWeightedHits / (state.testWeightedHits + state.testMisses) : 0;
    }

    var meanRt = 1500;
    if (state.testRt.length) {
      var rs = 0;
      for (i = 0; i < state.testRt.length; i++) rs += state.testRt[i];
      meanRt = rs / state.testRt.length;
    }
    var rtNorm = clamp(meanRt / RT_REF, 0, 1);

    var raw = 0.40 * accuracy + 0.30 * smoothness - 0.20 * deviation - 0.10 * rtNorm;
    var score = clamp((raw + 0.30) * 100, 0, 100);

    var t = {
      index: round, sens: pt.sens, dpi: pt.dpi,
      taskType: state.currentTaskType,
      warmup: !!pt.warmup,
      accuracy: accuracy, smoothness: smoothness, deviation: deviation,
      rt: meanRt, rtNorm: rtNorm, score: score,
      hits: state.testHits, misses: state.testMisses,
      trackOnTarget: state.trackOnTarget, trackTotal: state.trackTotal,
      frames: n, maxGap: telemetry.maxGap, meanDepth: meanDepth,
      missData: state.missData.slice(),
      valid: false
    };
    t.valid = isValidTrial(t);
    return t;
  }

  function isValidTrial(t) {
    if (t.warmup) return false; // warm-up never counts
    if (t.frames < 60) return false;
    if (t.maxGap > 0.40) return false;
    if (t.taskType === 'tracking') {
      if (t.trackTotal < 200) return false;
      if (t.accuracy < 0.10) return false;
    } else {
      if (t.hits + t.misses < 4) return false;
      if (t.hits < 1) return false;
      if (t.accuracy < 0.10) return false;
      if (t.rt > 1500) return false;
    }
    if (t.smoothness < 0.02) return false;
    return true;
  }

  /* =========================================================================
   *  WORKER
   * =======================================================================*/
  function createWorker() {
    try {
      var src =
        'var kKernel='   + kKernel.toString()   + ';\n' +
        'var kRegress='  + kRegress.toString()  + ';\n' +
        'var kOptimize=' + kOptimize.toString() + ';\n' +
        'var kAcquire='  + kAcquire.toString()  + ';\n' +
        'self.onmessage=function(e){' +
          'var m=e.data,res;' +
          'if(m.cmd==="optimize"){res=kOptimize(m.obs,m.ranges,m.ss,m.sd,m.anchorDpi,m.tol);}' +
          'else if(m.cmd==="suggest"){res=kAcquire(m.obs,m.ranges,m.ss,m.sd,m.kappa);}' +
          'self.postMessage({id:m.id,result:res});' +
        '};';
      var url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
      var w = new Worker(url);
      w.onmessage = function(e){
        var p = state.pending[e.data.id];
        if (p) { delete state.pending[e.data.id]; p.resolve(e.data.result); }
      };
      w.onerror = function(){
        state.worker = null;
        for (var id in state.pending) {
          var p = state.pending[id]; delete state.pending[id];
          try { p.resolve(p.local()); } catch (err) { p.resolve(null); }
        }
      };
      return w;
    } catch (err) { return null; }
  }

  function requestSuggest() {
    return new Promise(function(resolve){
      var r = state.ranges;
      var local = function(){ return kAcquire(state.observations, r, SIGMA_S, SIGMA_D, UCB_KAPPA); };
      if (state.worker) {
        var id = ++state.reqId;
        state.pending[id] = { resolve: resolve, local: local };
        state.worker.postMessage({ cmd: 'suggest', id: id, obs: state.observations, ranges: r, ss: SIGMA_S, sd: SIGMA_D, kappa: UCB_KAPPA });
      } else resolve(local());
    });
  }

  function requestOptimize() {
    return new Promise(function(resolve){
      var r = state.ranges;
      var local = function(){ return kOptimize(state.observations, r, SIGMA_S, SIGMA_D, state.dpi, RIDGE_TOL); };
      if (state.worker) {
        var id = ++state.reqId;
        state.pending[id] = { resolve: resolve, local: local };
        state.worker.postMessage({ cmd: 'optimize', id: id, obs: state.observations, ranges: r, ss: SIGMA_S, sd: SIGMA_D, anchorDpi: state.dpi, tol: RIDGE_TOL });
      } else resolve(local());
    });
  }

  /* =========================================================================
   *  3D SCENE
   * =======================================================================*/
  var targetGeom = new THREE.SphereGeometry(0.55, 16, 16);
  var targetMat  = new THREE.MeshStandardMaterial({
    color: 0xe8a33d, emissive: 0xe8a33d, emissiveIntensity: 0.4, metalness: 0.3, roughness: 0.4
  });

  function computeVerticalFov(hFovDeg, aspect) {
    var hRad = hFovDeg * Math.PI / 180;
    var vRad = 2 * Math.atan(Math.tan(hRad / 2) / aspect);
    return vRad * 180 / Math.PI;
  }

  function spawnTarget() {
    if (!state.scene) return;
    if (state.target) state.scene.remove(state.target);
    state.target = new THREE.Mesh(targetGeom, targetMat);

    var taskType = state.currentTaskType;

    if (taskType === 'micro') {
      // Small offset from last target position (or centered at first spawn)
      var lastX = state.lastTargetX || 0, lastY = state.lastTargetY || 2.5;
      var z = -12;
      var nx = clamp(lastX + (Math.random() - 0.5) * 4, -7, 7);
      var ny = clamp(lastY + (Math.random() - 0.5) * 4, 0.5, 5.5);
      state.target.position.set(nx, ny, z);
      state.lastTargetX = nx;
      state.lastTargetY = ny;
    } else if (taskType === 'tracking') {
      // Lissajous path setup
      var mode = DISTANCE_MODES[state.distanceMode] || DISTANCE_MODES.mixed;
      var d = mode.minDist + Math.random() * (mode.maxDist - mode.minDist);
      var z = -d;
      state.trackBaseX = (Math.random() - 0.5) * 4;
      state.trackBaseY = 2 + Math.random() * 2;
      state.trackAmpX = 4 + Math.random() * 3;
      state.trackAmpY = 1.5 + Math.random() * 1.5;
      state.trackFx = 0.4 + Math.random() * 0.3;
      state.trackFy = 0.35 + Math.random() * 0.3;
      state.trackPhase = Math.random() * Math.PI * 2;
      state.target.position.set(state.trackBaseX, state.trackBaseY, z);
      state.lastTargetX = state.trackBaseX;
      state.lastTargetY = state.trackBaseY;
    } else {
      // flick (default)
      var mode2 = DISTANCE_MODES[state.distanceMode] || DISTANCE_MODES.mixed;
      var d2 = mode2.minDist + Math.random() * (mode2.maxDist - mode2.minDist);
      var x = (Math.random() - 0.5) * 14;
      var y = 0.5 + Math.random() * 5;
      state.target.position.set(x, y, -d2);
      state.lastTargetX = x;
      state.lastTargetY = y;
    }
    state.scene.add(state.target);
    state.targetSpawnTime = performance.now();
    state.targetReacted = false;
  }

  function initScene() {
    if (state.renderer) { state.renderer.domElement.remove(); state.renderer.dispose(); }
    var wrap = document.getElementById('scene-wrap');
    if (!wrap) return;
    var w = wrap.clientWidth || window.innerWidth;
    var h = wrap.clientHeight || window.innerHeight;

    state.scene = new THREE.Scene();
    state.scene.background = new THREE.Color(0x05070a);
    state.scene.fog = new THREE.Fog(0x05070a, 25, 45);

    var aspect = w / h;
    var vFov = computeVerticalFov(state.hFov, aspect);
    state.camera = new THREE.PerspectiveCamera(vFov, aspect, 0.1, 100);
    state.camera.position.set(0, 1.7, 0);
    state.camera.quaternion.set(0, 0, 0, 1);

    state.renderer = new THREE.WebGLRenderer({ antialias: true });
    state.renderer.setSize(w, h);
    state.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    state.scene.add(new THREE.AmbientLight(0x404060, 0.6));
    var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    state.scene.add(dirLight);
    var fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
    fillLight.position.set(-5, 5, -5);
    state.scene.add(fillLight);

    var grid = new THREE.GridHelper(60, 30, 0x1a2332, 0x1a2332);
    grid.position.y = -0.5;
    state.scene.add(grid);

    state.raycaster = new THREE.Raycaster();
    animate();
  }

  function resizeScene() {
    if (!state.renderer) return;
    var wrap = document.getElementById('scene-wrap');
    if (!wrap) return;
    var w = wrap.clientWidth, h = wrap.clientHeight;
    if (w > 0 && h > 0) {
      state.renderer.setSize(w, h);
      if (state.camera) {
        state.camera.aspect = w / h;
        state.camera.fov = computeVerticalFov(state.hFov, w / h);
        state.camera.updateProjectionMatrix();
      }
    }
  }

  function logFrame(now) {
    var n = telemetry.n;
    if (n >= TELEM_CAP) return;
    var q = state.camera.quaternion;
    var omega = 0, alpha = 0;
    if (_prevLogged) {
      var dt = (now - _prevTime) / 1000;
      if (dt > telemetry.maxGap) telemetry.maxGap = dt;
      if (dt > 0.0005) {
        _prevQInv.copy(_prevQ).invert();
        _dq.copy(q).multiply(_prevQInv);
        var angle = 2 * Math.acos(clamp(Math.abs(_dq.w), 0, 1));
        var omegaRaw = angle / dt;
        _omegaEMA += 0.4 * (omegaRaw - _omegaEMA);
        var alphaRaw = (_omegaEMA - _prevOmegaEMA) / dt;
        _alphaEMA += 0.4 * (alphaRaw - _alphaEMA);
        _prevOmegaEMA = _omegaEMA;
        omega = _omegaEMA; alpha = _alphaEMA;
      }
    }
    if (state.target && !state.targetReacted && omega > RT_MOVE_THRESH) {
      state.targetReacted = true;
      state.testRt.push(now - state.targetSpawnTime);
    }

    var dist = 0, dev = 0;
    var onTarget = false;
    if (state.target) {
      _fwd.set(0, 0, -1).applyQuaternion(q);
      _toT.copy(state.target.position).sub(state.camera.position);
      dist = _toT.length();
      if (dist > 1e-4) {
        _cross.crossVectors(_fwd, _toT);
        dev = _cross.length() / dist;
        if (state.currentTaskType === 'tracking' && dev < TRACK_THRESH_RAD) onTarget = true;
      }
    }

    if (state.currentTaskType === 'tracking' && state.testActive) {
      state.trackTotal++;
      if (onTarget) state.trackOnTarget++;
    }

    // Realtime graph ring buffer
    if (state.graphEnabled) {
      state.graphOmega[state.graphIdx] = omega;
      state.graphDist[state.graphIdx] = dist;
      state.graphIdx = (state.graphIdx + 1) % state.graphOmega.length;
    }

    telemetry.t[n] = now;
    telemetry.qx[n] = q.x; telemetry.qy[n] = q.y;
    telemetry.qz[n] = q.z; telemetry.qw[n] = q.w;
    telemetry.w[n] = omega; telemetry.a[n] = alpha;
    telemetry.dev[n] = dev; telemetry.dist[n] = dist;
    telemetry.n = n + 1;
    _prevQ.copy(q);
    _prevTime = now;
    _prevLogged = true;
  }

  function animate() {
    if (!state.renderer || !state.scene || !state.camera) return;
    state.animId = requestAnimationFrame(animate);
    var now = performance.now();

    // Update tracking target motion
    if (state.testActive && state.currentTaskType === 'tracking' && state.target) {
      var elapsed = (now - state.testStartTime) / 1000;
      state.target.position.x = state.trackBaseX + state.trackAmpX * Math.sin(elapsed * state.trackFx * Math.PI * 2);
      state.target.position.y = state.trackBaseY + state.trackAmpY * Math.sin(elapsed * state.trackFy * Math.PI * 2 + state.trackPhase);
    }

    if (state.testActive) logFrame(now);

    // Realtime graph (throttled)
    if (state.graphEnabled && state.graphCanvas && (now - state.graphLastRender) > GRAPH_UPDATE_MS) {
      state.graphLastRender = now;
      drawRealtimeGraph();
    }

    state.renderer.render(state.scene, state.camera);
  }

  /* =========================================================================
   *  INPUT HANDLERS
   * =======================================================================*/
  function setupGlobalInputHandlers() {
    document.addEventListener('mousemove', function(e){
      if (!state.testActive || !state.camera) return;
      if (!isPointerLocked()) return;
      applyLook(e.movementX, e.movementY);
    });

    document.addEventListener('mousedown', function(e){
      if (!state.testActive || !state.camera) return;
      if (!isPointerLocked()) return;
      if (e.button !== undefined && e.button !== 0) return;
      AudioSys.shoot();
      if (!state.target) return;

      state.raycaster.setFromCamera({ x: 0, y: 0 }, state.camera);
      var hits = state.raycaster.intersectObject(state.target);
      var ch = document.getElementById('crosshair-container');

      if (hits.length > 0) {
        state.testHits++;
        AudioSys.hit();
        var dist = hits[0].distance;
        var wgt = 1 + 0.6 * clamp((dist - 8) / 8, 0, 1);
        state.testWeightedHits += wgt;
        if (ch) ch.classList.remove('miss');
        if (state.currentTaskType !== 'tracking') spawnTarget();
        else { state.targetSpawnTime = performance.now(); state.targetReacted = false; }
      } else {
        state.testMisses++;
        AudioSys.miss();
        if (ch) {
          ch.classList.add('miss');
          setTimeout(function(){ ch.classList.remove('miss'); }, 80);
        }
        // Record miss angle for heatmap
        if (state.missData.length < 200) {
          _fwd.set(0, 0, -1).applyQuaternion(state.camera.quaternion);
          _toT.copy(state.target.position).sub(state.camera.position).normalize();
          _right.set(1, 0, 0).applyQuaternion(state.camera.quaternion);
          _up.set(0, 1, 0).applyQuaternion(state.camera.quaternion);
          var dx = _toT.dot(_right);
          var dy = _toT.dot(_up);
          var fz = _toT.dot(_fwd);
          var ax = Math.atan2(dx, fz) * 180 / Math.PI;
          var ay = Math.atan2(dy, fz) * 180 / Math.PI;
          state.missData.push({ x: ax, y: ay });
        }
      }
    });

    document.addEventListener('pointerlockchange', function(){
      if (!state.testActive) return;
      if (!isPointerLocked()) pauseTest('Pointer lock terlepas. Klik Resume untuk melanjutkan.');
    });

    window.addEventListener('blur', function(){
      if (state.testActive) pauseTest('Jendela kehilangan fokus. Klik Resume untuk melanjutkan.');
    });
    document.addEventListener('visibilitychange', function(){
      if (document.hidden && state.testActive) pauseTest('Tab tidak aktif. Klik Resume untuk melanjutkan.');
    });

    document.addEventListener('keydown', function(e){
      if (state.screen !== 'test') return;
      if (e.code === 'KeyM') { e.preventDefault(); toggleSound(); }
      if (e.code === 'KeyG') {
        e.preventDefault();
        state.graphEnabled = !state.graphEnabled;
        saveCurrentToProfile();
        var c = document.getElementById('realtime-graph');
        if (c) c.classList.toggle('on', state.graphEnabled);
        if (state.graphEnabled) { if (!state.graphCanvas) initRealtimeGraph(); }
      }
    });

    window.addEventListener('resize', resizeScene);
  }

  /* =========================================================================
   *  CLEANUP / FINISH
   * =======================================================================*/
  function cleanupTest() {
    state.testActive = false;
    if (state.hudTimer)  { clearInterval(state.hudTimer);  state.hudTimer = null; }
    if (state.testTimer) { clearTimeout(state.testTimer); state.testTimer = null; }
    if (state.target && state.scene) { state.scene.remove(state.target); state.target = null; }
    state.trialResolve = null;
    releasePointerLock();
  }

  async function finishPSA() {
    cleanupTest();
    if (state.renderer) {
      cancelAnimationFrame(state.animId);
      state.renderer.domElement.remove();
      state.renderer.dispose();
      state.renderer = null;
    }
    state.screen = 'results';

    var best = null, i;
    for (i = 0; i < state.trials.length; i++) {
      var t = state.trials[i];
      if (t.valid && (!best || t.score > best.score)) best = t;
    }

    if (state.observations.length >= 3) {
      var opt = await requestOptimize();
      opt.sufficient = true;
      state.optimum = opt;
    } else {
      state.optimum = {
        sens: best ? best.sens : state.baseSens,
        dpi:  best ? best.dpi  : state.dpi,
        score: best ? best.score : 0,
        variance: 0, sufficient: false
      };
    }

    // Save session to history
    var opt = state.optimum;
    var game = GAMES[state.game];
    var sigma = Math.sqrt(Math.max(0, opt.variance || 0));
    var conf = !opt.sufficient ? 'insufficient' : (sigma < 6 ? 'high' : (sigma < 12 ? 'mid' : 'low'));
    var maxScore = 0;
    for (var k = 0; k < state.trials.length; k++) if (state.trials[k].valid && state.trials[k].score > maxScore) maxScore = state.trials[k].score;
    pushHistory({
      ts: Date.now(),
      game: state.game,
      gameLabel: game.label,
      sens: opt.sens,
      dpi: opt.dpi,
      edpi: opt.sens * opt.dpi,
      cm360: cm360(opt.sens, opt.dpi, game.yaw),
      bestScore: maxScore,
      confidence: conf,
      distanceMode: state.distanceMode,
      taskMix: state.taskMix,
      hFov: state.hFov
    });

    renderResults();
  }

  /* =========================================================================
   *  RESULTS
   * =======================================================================*/
  function renderResults() {
    body.classList.remove('no-scroll');
    var game = GAMES[state.game];
    var opt = state.optimum;
    var trials = state.trials;
    var r = state.ranges;
    var optimalSens = opt.sens;
    var optimalDpi = opt.dpi;
    var cms = cm360(optimalSens, optimalDpi, game.yaw);
    var eDpi = optimalSens * optimalDpi;

    var sigma = Math.sqrt(Math.max(0, opt.variance || 0));
    var conf;
    if (!opt.sufficient) conf = 'data belum cukup';
    else if (sigma < 6)  conf = 'tinggi';
    else if (sigma < 12) conf = 'sedang';
    else                 conf = 'rendah';

    var maxScore = 0, i;
    for (i = 0; i < trials.length; i++) if (trials[i].score > maxScore) maxScore = trials[i].score;
    if (maxScore <= 0) maxScore = 1;

    var runningBest = 0;
    var convBars = trials.map(function(t, idx){
      if (t.valid && t.score > runningBest) runningBest = t.score;
      var sensPct = (r.sensMax - r.sensMin) > 0 ? clamp((t.sens - r.sensMin) / (r.sensMax - r.sensMin), 0, 1) * 100 : 50;
      var fillPct = clamp(runningBest, 0, 100);
      var dim = t.valid ? '' : ';opacity:0.22';
      return '<div class="sf-bar-row">' +
        '<div class="sf-bar-round">' + (t.warmup ? 'W' : 'T' + (idx + 1)) + '</div>' +
        '<div class="sf-bar-track" style="position:relative;">' +
          '<div class="sf-bar-fill" style="position:absolute;left:0%;width:' + fillPct + '%;height:100%' + dim + ';border-radius:3px;"></div>' +
          '<div style="position:absolute;left:' + sensPct + '%;top:-2px;bottom:-2px;width:3px;background:var(--accent-2);transform:translateX(-1.5px);border-radius:2px;box-shadow:0 0 8px var(--accent-2);"></div>' +
        '</div>' +
        '<div style="font-size:10px;color:var(--muted);width:96px;flex-shrink:0;text-align:right;font-family:var(--mono);">' + t.sens.toFixed(4) + ' @ ' + Math.round(t.dpi) + '</div>' +
        '<div style="font-size:10px;color:var(--accent);width:34px;flex-shrink:0;text-align:right;font-family:var(--mono);">' + t.score.toFixed(0) + '</div>' +
      '</div>';
    }).join('');

    var bestScore = 0;
    trials.forEach(function(t){ if (t.valid && t.score > bestScore) bestScore = t.score; });

    var scoreBars = trials.map(function(t, idx){
      var pct = maxScore > 0 ? (t.score / maxScore) * 100 : 0;
      var isBest = (t.valid && t.score === bestScore);
      return '<div class="sf-bar-row">' +
        '<div class="sf-bar-label" style="width:120px;">' + (t.warmup ? 'W' : 'T' + (idx + 1)) + ' ' + t.sens.toFixed(3) + '/' + Math.round(t.dpi) +
          '<span style="color:var(--muted-2);font-size:9px;"> ' + (t.taskType.charAt(0).toUpperCase()) + '</span></div>' +
        '<div class="sf-bar-track"><div class="sf-bar-fill" style="width:' + pct + '%' + (isBest ? '' : ';opacity:0.6') + (t.valid ? '' : ';background:#3a4048') + '"></div></div>' +
        '<div class="sf-bar-val">' + t.score.toFixed(0) + '</div></div>';
    }).join('');

    var tableRows = trials.map(function(t){
      var mark = t.valid ? '' : ' ✕';
      var taskCode = t.taskType.charAt(0).toUpperCase();
      return '<tr' + (t.valid && t.score === bestScore ? ' class="best"' : '') + (t.valid ? '' : ' class="invalid"') + '>' +
        '<td>' + (t.warmup ? 'W' : t.index) + mark + '</td>' +
        '<td>' + taskCode + '</td>' +
        '<td>' + t.sens.toFixed(4) + '</td>' +
        '<td>' + Math.round(t.dpi) + '</td>' +
        '<td>' + (t.accuracy * 100).toFixed(0) + '%</td>' +
        '<td>' + t.smoothness.toFixed(3) + '</td>' +
        '<td>' + t.deviation.toFixed(3) + '</td>' +
        '<td>' + t.rt.toFixed(0) + '</td>' +
        '<td>' + t.score.toFixed(1) + '</td></tr>';
    }).join('');

    var validCount = state.observations.length;

    /* Heatmap from last valid flick trial's miss data */
    var lastFlickMisses = [];
    for (var mm = state.trials.length - 1; mm >= 0; mm--) {
      var tt = state.trials[mm];
      if (tt.valid && tt.missData && tt.missData.length > 0) { lastFlickMisses = tt.missData; break; }
    }

    var heatmapSvg = renderHeatmapSVG(lastFlickMisses);

    body.innerHTML =
      '<div class="sf-container">' +
        '<div class="sf-hero">' +
          '<div class="sf-title">Hasil Optimasi — Selesai</div>' +
          '<div class="sf-sub">Sesi ' + game.label + ' · ' + TASK_MODES[state.taskMix].label + ' · ' + DISTANCE_MODES[state.distanceMode].label + ' · FOV ' + state.hFov + '° · ' + validCount + '/' + TOTAL_TRIALS + ' trial valid.</div>' +
        '</div>' +

        '<div class="sf-recommend">' +
          '<div class="sf-label">' + icon('zap', 12) + game.label + ' — Rekomendasi</div>' +
          '<div class="sf-recommend-value">' + optimalSens.toFixed(4) + '</div>' +
          '<div class="sf-recommend-sub">DPI ' + Math.round(optimalDpi) + ' · ' + cms.toFixed(1) + ' cm/360° · ' + eDpi.toFixed(0) + ' eDPI · confidence: ' + conf + '</div>' +
        '</div>' +

        '<div class="sf-grid2" style="grid-template-columns: 1fr 1fr; align-items:start;">' +

          '<div class="sf-card">' +
            '<div class="sf-card-header">' + icon('chart', 16) + '<div class="sf-card-title">Konvergensi</div></div>' +
            '<div class="sf-sub" style="font-size:11.5px;">Bar = skor terbaik kumulatif. Garis cyan = posisi sens diuji.</div>' +
            '<div class="sf-bars">' + convBars + '</div>' +
          '</div>' +

          '<div class="sf-card">' +
            '<div class="sf-card-header">' + icon('target', 16) + '<div class="sf-card-title">Miss Heatmap</div>' +
              '<div class="sf-card-sub">' + lastFlickMisses.length + ' shots</div></div>' +
            '<div class="sf-heatmap-wrap">' +
              heatmapSvg +
              '<div class="sf-heatmap-legend">' +
                '<div class="sub" style="font-size:11.5px;color:var(--muted);">Posisi crosshair saat miss (dalam derajat). Center = tepat di target.</div>' +
                '<div class="legend-row"><div class="dot" style="background:#ff5d5d;"></div><span style="font-size:11.5px;">Miss shots</span></div>' +
                '<div class="legend-row"><div class="dot" style="background:#45d6c4;"></div><span style="font-size:11.5px;">Target center</span></div>' +
                '<div class="legend-row" style="margin-top:6px;color:var(--muted);font-size:11px;">' +
                  '<span>Radius tiap ring = 2°</span>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +

        '</div>' +

        '<div class="sf-card">' +
          '<div class="sf-card-header">' + icon('chart', 16) + '<div class="sf-card-title">Skor Semua Trial</div></div>' +
          '<div class="sf-sub" style="font-size:11.5px;">Score = 0.40·Acc + 0.30·Smooth − 0.20·Dev − 0.10·RT. Tertinggi: ' + bestScore.toFixed(1) + '.</div>' +
          '<div class="sf-bars">' + scoreBars + '</div>' +
        '</div>' +

        '<div class="sf-card">' +
          '<div class="sf-card-header">' + icon('grid', 16) + '<div class="sf-card-title">Data Mentah</div></div>' +
          '<div style="overflow-x:auto;">' +
            '<table class="sf-table"><thead><tr><th>#</th><th>Task</th><th>Sens</th><th>DPI</th><th>Acc</th><th>Smooth</th><th>Dev</th><th>RT</th><th>Skor</th></tr></thead><tbody>' + tableRows + '</tbody></table>' +
          '</div>' +
        '</div>' +

        '<div class="' + (opt.sufficient ? 'sf-info' : 'sf-warn') + '">' +
          icon(opt.sufficient ? 'info' : 'alert', 16) +
          '<div>' +
            (opt.sufficient
              ? 'Rekomendasi berbasis eDPI. Ubah nilai sens di game; DPI bisa tetap. Hasil ini snapshot performa saat ini — bisa bergeser setelah warm-up atau growth.'
              : '<strong>Data belum cukup.</strong> Hanya ' + validCount + ' trial valid dari ' + TOTAL_TRIALS + '. Coba ulangi dengan lebih fokus.') +
          '</div>' +
        '</div>' +

        '<div class="sf-btn-row" style="justify-content:flex-end;">' +
          '<button class="sf-btn ghost" id="sf-restart-btn">' + icon('refresh', 14) + 'Ulangi</button>' +
          '<button class="sf-btn" id="sf-copy-btn">' + icon('copy', 14) + 'Salin ' + optimalSens.toFixed(4) + ' @ ' + Math.round(optimalDpi) + ' DPI</button>' +
        '</div>' +

        '<div class="sf-disclaimer">Tool ini estimasi awal dari aim-test browser. Sesuaikan manual di game.</div>' +
      '</div>';

    document.getElementById('sf-copy-btn').addEventListener('click', function(){
      var txt = optimalSens.toFixed(4) + ' @ ' + Math.round(optimalDpi) + ' DPI';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function(){
          var btn = document.getElementById('sf-copy-btn');
          var orig = btn.innerHTML;
          btn.innerHTML = icon('check', 14) + 'Tersalin';
          setTimeout(function(){ btn.innerHTML = orig; }, 1400);
        }).catch(function(){});
      }
    });

    document.getElementById('sf-restart-btn').addEventListener('click', returnToSetup);
  }

  function renderHeatmapSVG(misses) {
    var W = 220, H = 220, R = 100, CX = 110, CY = 110;
    var maxAngle = 10;
    var scale = R / maxAngle;
    var rings = '';
    for (var rr = 2; rr <= maxAngle; rr += 2) {
      var rpx = rr * scale;
      rings += '<circle cx="' + CX + '" cy="' + CY + '" r="' + rpx + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>';
    }
    var cross = '<line x1="' + (CX - R) + '" y1="' + CY + '" x2="' + (CX + R) + '" y2="' + CY + '" stroke="rgba(255,255,255,0.08)"/>' +
                '<line x1="' + CX + '" y1="' + (CY - R) + '" x2="' + CX + '" y2="' + (CY + R) + '" stroke="rgba(255,255,255,0.08)"/>';
    var dots = misses.map(function(m) {
      var x = CX + clamp(m.x, -maxAngle, maxAngle) * scale;
      var y = CY - clamp(m.y, -maxAngle, maxAngle) * scale;
      return '<circle cx="' + x + '" cy="' + y + '" r="3" fill="rgba(255,93,93,0.75)" stroke="#ff5d5d" stroke-width="0.5"/>';
    }).join('');
    var center = '<circle cx="' + CX + '" cy="' + CY + '" r="4" fill="#45d6c4"/>';
    var labels = '<text x="' + (CX + R - 6) + '" y="' + (CY - 4) + '" fill="#7c8797" font-size="9" font-family="monospace" text-anchor="end">+X</text>' +
                 '<text x="' + (CX + 4) + '" y="' + (CY - R + 12) + '" fill="#7c8797" font-size="9" font-family="monospace">+Y</text>';
    return '<svg class="sf-heatmap-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
      rings + cross + dots + center + labels + '</svg>';
  }

  /* =========================================================================
   *  BOOT
   * =======================================================================*/
  function init() {
    state.worker = createWorker();
    brandIcon.innerHTML = icon('target', 16);
    setupGlobalInputHandlers();
    root.hidden = false;
    loader.classList.add('hidden');
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
